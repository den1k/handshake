let D = blankDraft();
const draftHasContent = () => !!(str(D.text) || str(D.reason));

/* ---------- derived ledger ---------- */
function derive() {
  const list = S.rules.slice().sort((a, b) => str(a.createdAt).localeCompare(str(b.createdAt)) || a.id.localeCompare(b.id));
  const byId = new Map();
  list.forEach((r, i) => { r.n = i + 1; r.by = []; r.pendingBy = []; r.agreed = new Map(); r.required = arr(r.required); byId.set(r.id, r); });
  for (const a of S.agr) { const r = byId.get(a.entryId); if (r && !r.agreed.has(a.userId)) r.agreed.set(a.userId, a.at); }
  // Someone who leaves stops blocking: an entry needs the members it required who are still here, plus anyone
  // who agreed before leaving (their agreement stays on record).
  for (const r of list) {
    r.requiredAll = r.requiredAll || r.required;
    r.required = r.requiredAll.filter(u => r.agreed.has(u) || S.members.some(m => m.id === u));
  }
  // Joining means agreeing to the agreement as a whole. A rule everyone had already agreed to when someone joined is
  // covered by that (r.covered); a rule still waiting when they joined needs them too.
  for (const r of list) {
    const doneAt = r.required.length && r.required.every(u => r.agreed.has(u)) ? r.required.map(u => r.agreed.get(u)).sort().pop() : '';
    r.covered = [];
    for (const m of S.members) {
      if (r.required.includes(m.id) || str(m.joinedAt) <= str(r.createdAt)) continue;
      if (doneAt && doneAt <= str(m.joinedAt)) r.covered.push(m.id); else r.required.push(m.id);
    }
  }
  // In effect once everyone has agreed, and, if the rule has an effective date, once that day has come.
  const today = new Date().toISOString().slice(0, 10);
  for (const r of list) {
    r.effectiveOn = /^\d{4}-\d{2}-\d{2}$/.test(str(r.effectiveOn)) ? r.effectiveOn : '';
    const all = r.required.length > 0 && r.required.every(u => r.agreed.has(u));
    r.scheduled = all && r.effectiveOn > today;
    r.effective = all && !r.scheduled;
    const last = all ? r.required.map(u => r.agreed.get(u)).sort().pop() : '';
    r.effectiveAt = r.effective ? [last, r.effectiveOn && r.effectiveOn + 'T00:00:00.000Z'].sort().pop() : '';
  }
  // A rule only replaces or repeals another once it is itself in effect.
  for (const r of list) for (const s of arr(r.supersedes)) { const t = byId.get(s); if (t && t !== r) (r.effective ? t.by : t.pendingBy).push(r); }
  for (const r of list) {
    // A rule replaced or repealed by one now in effect is closed, even if it never came into force itself.
    r.status = r.by.length && r.kind !== 'repeal' ? (r.by.some(x => x.kind === 'repeal') ? 'repealed' : 'superseded')
      : r.scheduled ? 'scheduled' : !r.effective ? 'pending' : r.kind === 'repeal' ? 'repeal' : 'force';
  }
  // A replaced rule was part of what someone agreed to only if they agreed to the whole agreement before it was replaced.
  for (const r of list) if (r.by.length) {
    const gone = r.by.map(b => str(b.effectiveAt)).filter(Boolean).sort()[0] || '';
    r.covered = r.covered.filter(id => { const at = acceptedAt(id); return at && (!gone || at <= gone); });
  }
  // Lines in the order people joined; someone who has left takes the place of the first entry that needed them.
  const firstNeed = id => { const r = list.find(x => x.requiredAll.includes(id)); return r ? str(r.createdAt) : '~'; };
  const lanes = S.members.map(m => ({ m, at: str(m.joinedAt) })).concat(S.former.map(m => ({ m, at: firstNeed(m.id) })))
    .sort((a, b) => a.at.localeCompare(b.at)).map(x => x.m);
  L = { list, byId, lanes };
}
const inForce = () => L.list.filter(r => r.status === 'force' && r.kind !== 'repeal');
// When a member agreed to the agreement as a whole: by signing it (legally binding) or by agreeing to it on joining.
function acceptedAt(id) {
  const m = S.members.find(x => x.id === id);
  const xs = (binding() ? S.ledgerSigs : S.accepts).filter(a => a.userId === id && (!m || str(a.at) >= str(m.joinedAt)));
  return xs.length ? xs[xs.length - 1].at : '';
}
// The rules someone agrees to by agreeing to the whole agreement: those already agreed when they joined, still standing.
const toAccept = id => L.list.filter(r => r.covered.includes(id) && (r.status === 'force' || r.status === 'scheduled'));
// Someone who joined after rules were agreed and hasn't yet agreed to the whole agreement.
const needsAccept = id => !acceptedAt(id) && toAccept(id).length > 0;
// Rules still waiting for my agreement (or signature), offered alongside agreeing to the whole agreement.
const waitingForMe = () => L.list.filter(r => r.status === 'pending' && r.required.includes(S.me) && !r.agreed.has(S.me));
const changeLinks = r => `<span class="e-actions"><button type="button" class="btn link" data-act="amend" data-id="${esc(r.id)}">Suggest a change</button>${r.status === 'force' ? `<button type="button" class="btn link" data-act="repeal" data-id="${esc(r.id)}">Repeal</button>` : ''}</span>`;
const reviewList = rules => `<ol class="sign-rules">${rules.map(r => `<li><strong>§ ${fol(r.n)} · ${esc(str(r.title))}</strong>${r.effectiveOn ? ` <span class="dim">effective from ${esc(fmtDay(r.effectiveOn))}</span>` : ''}<p>${marked(str(r.text))}</p>${changeLinks(r)}</li>`).join('')}</ol>`;
const waitingList = (rules, verb) => rules.length ? `<h3>Waiting for ${verb === 'sign' ? 'your signature' : 'your agreement'}</h3>
  <p class="hint">Ticked rules are ${verb === 'sign' ? 'signed' : 'agreed'} along with the agreement, each on its own. Untick any you want to change or settle later.</p>
  <ul class="sign-waiting">${rules.map(r => `<li><label class="check"><input type="checkbox" data-also="${esc(r.id)}" checked><span><strong>§ ${fol(r.n)} · ${esc(str(r.title))}</strong>${r.effectiveOn ? ` <span class="dim">effective from ${esc(fmtDay(r.effectiveOn))}</span>` : ''}<span class="also-text">${marked(str(r.text))}</span></span></label>${changeLinks(r)}</li>`).join('')}</ul>` : '';
const alsoTicked = () => [...document.querySelectorAll('[data-also]')].filter(x => x.checked).map(x => L.byId.get(x.dataset.also)).filter(Boolean);

/* ---------- legally binding ledgers ---------- */
const binding = () => !!(S.ledger && S.ledger.binding);
const mySignedLedger = () => S.ledgerSigs.some(s => s.userId === S.me);
const sigOf = (entryId, userId) => S.sigs.find(s => s.entryId === entryId && s.userId === userId);
const shortHash = h => h ? h.slice(0, 8) + '…' + h.slice(-4) : '';
// The name last typed to sign, remembered per account (never another person's, even on a shared computer).
function legalName() { try { return localStorage.getItem('handshake.legalName.' + S.me) || (S.user && S.user.name) || ''; } catch (e) { return (S.user && S.user.name) || ''; } }
function rememberName(n) { try { localStorage.setItem('handshake.legalName.' + S.me, n); } catch (e) {} }
// The signature fields used everywhere a binding signature is made.
const signFields = (prefix, statement, purpose) => `<div class="sigbox">
    <p class="hint">By signing, you make this statement:</p>
    <p class="sig-statement">${esc(statement)}</p>
    <label class="field"><span class="lbl">Your full legal name</span><input type="text" id="${prefix}-name" maxlength="120" autocomplete="name" value="${esc(legalName())}"></label>
    ${S.ledger && S.ledger.verifyEmail ? `<div class="field"><span class="lbl">Code from your email</span>
      <div class="row code-row"><input type="text" id="${prefix}-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 digits" aria-label="Code from your email"><button type="button" class="btn small" data-act="send-code" data-purpose="${esc(purpose)}" data-prefix="${esc(prefix)}">Email me a code</button></div>
      <p class="hint" id="${prefix}-code-hint">This agreement confirms every signature with a code sent to ${esc(S.myEmail || 'your Google address')}.</p></div>` : ''}
  </div>`;
// Keep what someone typed in a signature box across a re-render.
const keepSigFields = prefix => { const n = $('#' + prefix + '-name'); return n ? { name: n.value, code: ($('#' + prefix + '-code') || {}).value || '' } : null; };
function restoreSigFields(prefix, k) {
  if (!k || !$('#' + prefix + '-name')) return;
  $('#' + prefix + '-name').value = k.name;
  if ($('#' + prefix + '-code')) $('#' + prefix + '-code').value = k.code;
}
async function sendCode(purpose, prefix) {
  if (purpose === 'new') { if (!D.entryId) { D.entryId = newId(); saveDraft(); } purpose = 'entry:' + D.entryId; }
  try {
    const out = await api('POST', `/api/ledgers/${S.ledger.id}/code`, { purpose });
    const h = $('#' + prefix + '-code-hint'); if (h) h.textContent = `Code sent to ${out.to}. It works for ten minutes.`;
    const c = $('#' + prefix + '-code'); if (c) c.focus();
  } catch (e) { toast(e.message || 'Couldn’t send a code. Try again.'); }
}
function readSignature(prefix) {
  // Pressing Sign, beside the statement, is the signer's intent; the one-time e-signature consent covers the rest.
  const n = $('#' + prefix + '-name');
  const typedName = str(n && n.value);
  if (typedName.length < 2) { if (n) n.focus(); toast('Type your full legal name to sign.'); return null; }
  const c = $('#' + prefix + '-code');
  if (c && !/^\d{6}$/.test(str(c.value))) { c.focus(); toast('Enter the six-digit code from your email. Use “Email me a code” to get one.'); return null; }
  rememberName(typedName);
  return c ? { typedName, intent: true, code: str(c.value) } : { typedName, intent: true };
}

/* ---------- people ---------- */
function nameOf(id) {
  if (!id) return 'someone';
  if (id === S.me) return 'you';
  const m = S.members.find(x => x.id === id);
  if (m) return m.name;
  const f = S.former.find(x => x.id === id);
  return f ? `${f.name} (left)` : 'a former member';
}
const firstName = id => id === S.me ? 'You' : nameOf(id).split(/\s+/)[0];
const fmtWhen = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };

/* ---------- ledger rendering ---------- */
const drafting = () => !$('#draft').hidden;
/* While drafting: the rules the check found (plus a rule being amended or repealed). */
function related() {
  if (!drafting()) return null;
  const ids = new Map();
  const add = (id, info) => { if (L.byId.has(id) && !ids.has(id)) ids.set(id, info); };
  for (const id of D.supersedes) add(id, { kind: D.mode === 'repeal' ? 'repeals' : 'replaces' });
  for (const r of D.related) add(r.ruleId, { kind: r.kind, note: r.explanation, quote: r.quoteOld, decision: DECIDE[D.resolve[r.ruleId]] });
  return { ids, checked: D.checked };
}

/* Every recorded link between rules, as edges from the newer rule (src) to the older one (dst). */
function edges() {
  const out = [], seen = new Set();
  const add = (src, dst, kind) => { const k = src + '>' + dst; if (src !== dst && L.byId.has(dst) && !seen.has(k)) { seen.add(k); out.push({ src, dst, kind }); } };
  for (const r of L.list) {
    for (const t of arr(r.supersedes)) add(r.id, t, r.kind === 'repeal' ? 'repeals' : 'replaces');
    for (const x of arr(r.relations).concat(arr(r.conflicts))) if (x && x.ruleId) add(r.id, x.ruleId, x.kind || 'related');
    for (const t of arr(r.relates)) add(r.id, t, 'related');
  }
  return out;
}
const VIEW = {
  out: { replaces: 'Replaced by', repeals: 'Repealed by', contradicts: 'Conflicts with', overlaps: 'Overlaps', refines: 'Refined by', related: 'Related to' },
  in: { replaces: 'Replaces', repeals: 'Repeals', contradicts: 'Conflicts with', overlaps: 'Overlaps', refines: 'Refines', related: 'Related to' },
};
/* The clicked rule and everything connected to it, near or far, labelled from its point of view. */
function connected(focusId) {
  const F = L.byId.get(focusId);
  if (!F) return null;
  const E = edges(), ids = new Map([[F.id, { kind: 'focus', label: 'Selected' }]]);
  const queue = [F.id];
  while (queue.length) {
    const cur = queue.shift();
    for (const e of E) {
      const other = e.src === cur ? e.dst : e.dst === cur ? e.src : null;
      if (!other || ids.has(other)) continue;
      const o = L.byId.get(other), via = L.byId.get(cur);
      const kind = e.kind === 'replaces' || e.kind === 'repeals' ? e.kind : e.kind;
      const label = cur === F.id ? `${VIEW[e.src === F.id ? 'out' : 'in'][kind] || 'Related to'} § ${fol(F.n)}` : `Linked through § ${fol(via.n)}`;
      ids.set(other, { kind: cur === F.id ? kind : 'related', label, note: o.n < F.n ? 'Earlier rule' : 'Later rule' });
      queue.push(other);
    }
  }
  return ids;
}

function renderLedger() {
  derive();
  const list = L.list;
  const nb = $('#newBtn');
  nb.hidden = !S.ledger || drafting();
  nb.textContent = draftHasContent() ? 'Resume draft' : 'New entry';
  $('#tools').hidden = !list.length;
  $('#ledger').classList.toggle('newest', S.newest);
  $('#ledger').style.setProperty('--lanes', Math.max(2, S.members.length + S.former.length));
  const head = $('#lhead'), bar = $('#filterbar'), rowsEl = $('#rows'), nextEl = $('#next'), foot = $('#lfoot');
  const only = h => { head.innerHTML = ''; bar.hidden = true; rowsEl.innerHTML = h; nextEl.innerHTML = ''; foot.innerHTML = ''; };
  if (!S.loaded) return only(`<p class="notice">Opening the agreement…</p>`);
  if (!list.length) return only(drafting() ? '' : emptyHTML());

  const rel = related() || (S.focus ? { ids: connected(S.focus) || new Map(), focus: true } : null);
  if (rel && rel.focus && !rel.ids.size) S.focus = null;
  const n = rel ? rel.ids.size : 0;
  const filtering = n > 0 && !S.showAll;
  const q = S.q.trim().toLowerCase();
  let rows;
  if (filtering) rows = list.filter(r => rel.ids.has(r.id));
  else {
    rows = list.filter(r => S.filter === 'all' || (S.filter === 'force' ? r.status === 'force' : S.filter === 'pending' ? r.status === 'pending' : ['superseded', 'repealed', 'repeal'].includes(r.status)));
    if (q) rows = rows.filter(r => `§ ${r.n} № ${r.n} ${str(r.title)} ${str(r.text)}`.toLowerCase().includes(q));
  }
  if (S.newest) rows = rows.slice().reverse();

  const order = S.newest ? 'newest first' : 'oldest first, latest at the bottom', arrow = S.newest ? '↓' : '↑';
  const sortBtn = label => `<button type="button" class="sort" data-act="order" title="Showing ${order}. Click to reverse." aria-label="${label === '§' ? 'Number' : label}: ${order}. Reverse the order">${label} <span class="arrow" aria-hidden="true">${arrow}</span></button>`;
  head.className = 'lhead';
  head.innerHTML = `${sortBtn('§')}${sortBtn('Recorded')}<span aria-hidden="true">Rule</span><span aria-hidden="true">${rel && n && !S.showAll ? 'Relation' : 'Status'}</span>`;

  const icon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v5l-4 2v-7z"/></svg>`;
  const rules = k => `${k} rule${k === 1 ? '' : 's'}`;
  if (rel && rel.focus) {
    const F = L.byId.get(S.focus), k = n - 1;
    bar.hidden = false;
    bar.innerHTML = S.showAll
      ? `${icon}<p><strong>Showing all entries.</strong> <span class="dim">§ ${fol(F.n)} and its ${rules(k)} are marked.</span></p><button type="button" class="btn link" data-act="show-related">Show only these</button><button type="button" class="btn link" data-act="unfocus">Done</button>`
      : `${icon}<p><strong>${k ? `Showing § ${fol(F.n)} and the ${rules(k)} connected to it.` : `§ ${fol(F.n)} isn’t connected to any other rule.`}</strong>${k ? ` <span class="dim">Earlier and later, near and far.</span>` : ''}</p><button type="button" class="btn link" data-act="unfocus">Show all entries</button>`;
  } else if (!rel || (!n && !rel.checked)) bar.hidden = true;
  else {
    bar.hidden = false;
    const hidden = list.length - n;
    bar.innerHTML = !n ? `${RINGS()}<p><strong>The check found no rules in force that this one touches.</strong></p>`
      : S.showAll ? `${icon}<p><strong>Showing all entries.</strong> <span class="dim">${rules(n)} ${n === 1 ? 'relates' : 'relate'} to your rule and ${n === 1 ? 'is' : 'are'} marked.</span></p><button type="button" class="btn link" data-act="show-related">Show only related</button>`
      : `${icon}<p><strong>Showing the ${rules(n)} your rule touches.</strong>${hidden ? ` <span class="dim">${hidden} other ${hidden === 1 ? 'entry is' : 'entries are'} hidden while you draft.</span>` : ''}</p>${hidden ? `<button type="button" class="btn link" data-act="show-all">Show all entries</button>` : ''}`;
  }

  const latest = list[list.length - 1];
  const keepSig = keepSigFields('es');
  rowsEl.innerHTML = rows.map((r, i) => rowHTML(r, rel && rel.ids.get(r.id), !rel && r === latest && !S.newest, rows[i - 1], rows[i + 1])).join('')
    || `<p class="notice">No entries match.</p>`;
  restoreSigFields('es', keepSig);
  nextEl.innerHTML = (S.ledger && !drafting() && S.filter === 'all' && !q) ? nextHTML() : '';
  const waiting = list.filter(r => r.status === 'pending').length;
  const scheduled = list.filter(r => r.status === 'scheduled').length;
  const tally = `${list.length} ${list.length === 1 ? 'entry' : 'entries'} · ${list.filter(r => r.status === 'force').length} in force${scheduled ? ` · ${scheduled} not yet in effect` : ''}${waiting ? ` · ${waiting} awaiting agreement` : ''}`;
  foot.innerHTML = `<p class="sc">${RINGS()}${tally}${RINGS()}</p>`;
}

function emptyHTML() {
  return `<div class="entry empty"><span class="num"><b>${fol(1)}</b></span><span class="date"></span><div class="e-body">
    <h2>Nothing recorded yet</h2>
    <p>Each entry is a rule, numbered and dated. It comes into effect once every member has agreed to it. Entries are never edited or deleted; to change a rule, you write a new one that replaces it, so the history of what you agreed stays readable.</p>
    <ol class="how">
      <li><strong>Write it roughly.</strong> Say the rule the way you’d say it to one another.</li>
      <li><strong>Check it.</strong> A quick check finds the earlier rules it touches, marks any conflict, and suggests edge cases you can add.</li>
      <li><strong>Save it.</strong> Choose which edge cases to include and whether a conflicting rule is superseded, then save.</li>
    </ol>
    <button class="btn primary" data-act="new">${RINGS()}Write the first rule</button>
  </div></div>`;
}

function nextHTML() {
  return `<button type="button" class="entry next" data-act="new"><span class="num"><b>${fol(L.list.length + 1)}</b></span><span class="date">Today</span><span class="e-body"><span class="next-label">${draftHasContent() ? 'Resume your draft…' : 'Write the next entry…'}</span></span></button>`;
}

const refBtn = (t, label) => `<button type="button" class="ref" data-act="goto" data-id="${esc(t.id)}" title="${esc(str(t.title))}">${esc(label)} § ${fol(t.n)}</button>`;

function agreementsHTML(r) {
  const people = r.required.map(u => {
    const at = r.agreed.get(u);
    const sig = sigOf(r.id, u);
    return `<li class="${at ? 'yes' : 'no'}"><i class="who-line" style="--c:${lineColor(u)}"></i><span class="who">${esc(firstName(u))}</span><span class="when">${at ? `<time datetime="${esc(at)}">${esc(fmtWhen(at))}</time>` : (binding() ? 'Not yet signed' : 'Not yet agreed')}</span>${sig ? `<span class="signed-as">Signed as “${esc(sig.typedName)}”</span>` : at && binding() ? '<span class="signed-as dim">Agreed before the agreement was binding</span>' : ''}</li>`;
  }).join('');
  const joined = r.covered.map(u => { const at = acceptedAt(u); return `<li class="${at ? 'yes' : 'no'}"><i class="who-line" style="--c:${lineColor(u)}"></i><span class="who">${esc(firstName(u))}</span><span class="when">${at
    ? `${binding() ? 'Signed the agreement' : 'Agreed to the whole agreement'}, <time datetime="${esc(at)}">${esc(fmtWhen(at))}</time>` : binding() ? 'Hasn’t signed the agreement yet' : 'Hasn’t agreed to the agreement yet'}</span></li>`; }).join('');
  const cert = binding() && r.hash ? `<li class="cert"><a href="/certificate/${esc(S.ledger.id)}/${esc(r.id)}" target="_blank" rel="noopener">Certificate</a><span class="dim">Fingerprint ${esc(shortHash(r.hash))}</span></li>` : '';
  return `<ul class="agreements" aria-label="${binding() ? 'Signatures' : 'Agreements'}">${people}${joined}${cert}</ul>`;
}

/* Members' lines, in the colours of the subway map, in the order they joined. */
const LINE_COLORS = ['#0080c7', '#f38400', '#009a63', '#dc1440', '#af3788', '#fdd200', '#74b02e', '#979799', '#996633'];
const lineColor = id => { const i = S.members.findIndex(m => m.id === id); return i < 0 ? 'var(--old)' : LINE_COLORS[i % LINE_COLORS.length]; };
// Every member's line runs the length of the agreement, since joining means agreeing to it as a whole; their stops
// and dashes say where they stand on each rule. Someone who has left keeps a grey line through the rows they agreed to.
const onLine = (m, r) => !!r && (S.former.includes(m) ? r.agreed.has(m.id) : true);
// A member's stop on a rule: they agreed to it, or it was covered when they agreed to the whole agreement.
const stopsAt = (m, r) => r.agreed.has(m.id) || (r.covered.includes(m.id) && !!acceptedAt(m.id));

/* The lane beside a rule: each member's line, and the rule as a station. Everyone agreed: one pill across
   the lines (a transfer station). Otherwise members side by side who agreed share a pill, anyone alone gets
   a stop, and a member still to agree has a dashed line. prev/next are the rows shown above and below. */
function laneHTML(r, prev, next) {
  const x = i => 16 + 15 * i;
  const on = L.lanes.map((m, i) => ({ m, i })).filter(({ m }) => onLine(m, r));
  const lines = on.map(({ m, i }) => {
    const wait = (r.status === 'pending' && r.required.includes(m.id) && !r.agreed.has(m.id)) || (r.covered.includes(m.id) && !acceptedAt(m.id));
    const cls = ['ln', !onLine(m, prev) && 'top', !onLine(m, next) && 'bot', wait && 'wait'].filter(Boolean).join(' ');
    return `<i class="${cls}" style="--c:${lineColor(m.id)};left:${x(i)}px"></i>`;
  }).join('');
  const stops = [];
  for (const { m, i } of on) {
    if (!stopsAt(m, r)) continue;
    const last = stops[stops.length - 1];
    if (last && last.to === i - 1) last.to = i; else stops.push({ from: i, to: i });
  }
  const old = r.status === 'superseded' || r.status === 'repealed', sched = r.status === 'scheduled';
  const stations = stops.map(s => `<i class="stn${old ? ' old' : sched ? ' sched' : ''}" style="left:${x(s.from) - 7}px;width:${15 * (s.to - s.from) + 26}px"></i>`).join('');
  return `<div class="lane" aria-hidden="true">${lines}${stations}</div>`;
}

function rowHTML(r, rel, isLatest, prev, next) {
  const past = r.status === 'superseded' || r.status === 'repealed';
  const waiting = r.required.filter(u => !r.agreed.has(u));
  const seal = { force: 'In force', superseded: 'Replaced', repealed: 'Repealed', repeal: 'Repeal in effect', pending: binding() ? 'Awaiting signatures' : 'Awaiting agreement',
    scheduled: `Takes effect ${fmtDay(r.effectiveOn)}` }[r.status];
  const links = [];
  for (const id of arr(r.supersedes)) { const t = L.byId.get(id); if (t) links.push(refBtn(t, r.kind === 'repeal' ? (r.effective ? 'Repeals' : r.scheduled ? 'Will repeal' : 'Would repeal') : (r.effective ? 'Replaces' : r.scheduled ? 'Will replace' : 'Would replace'))); }
  for (const b of r.by) links.push(refBtn(b, b.kind === 'repeal' ? 'Repealed by' : 'Replaced by'));
  for (const id of arr(r.relates)) { const t = L.byId.get(id); if (t) links.push(refBtn(t, 'See also')); }
  const actions = [];
  const mine = r.required.includes(S.me) && !r.agreed.has(S.me);
  if (!rel || rel.kind === 'focus') {
    if (mine && !past) actions.push(binding()
      ? `<button type="button" class="btn small primary" data-act="${mySignedLedger() ? 'open-sign' : 'sign-ledger-view'}" data-id="${esc(r.id)}">${RINGS()}${mySignedLedger() ? `Agree and sign § ${fol(r.n)}` : 'Sign the agreement first'}</button>`
      : `<button type="button" class="btn small primary" data-act="agree" data-id="${esc(r.id)}">${RINGS()}Agree to § ${fol(r.n)}</button>`);
    if (r.status === 'force') {
      actions.push(`<button type="button" class="btn link" data-act="amend" data-id="${esc(r.id)}">Amend</button>`);
      actions.push(`<button type="button" class="btn link" data-act="repeal" data-id="${esc(r.id)}">Repeal</button>`);
    } else if (r.status === 'pending' && r.kind !== 'repeal') {
      actions.push(`<button type="button" class="btn link" data-act="amend" data-id="${esc(r.id)}">Suggest a change</button>`);
    }
  }
  const pendingNote = r.pendingBy.length && r.status === 'force'
    ? `<p class="pending-note">${r.pendingBy.map(b => `Will be ${b.kind === 'repeal' ? 'repealed' : 'replaced'} by ${refBtn(b, '').replace('> §', '>§')} ${b.scheduled ? `on ${fmtDay(b.effectiveOn)}` : 'once everyone agrees'}`).join('; ')}.</p>` : '';
  const status = rel
    ? `<span class="rel r-${esc(rel.kind)}">${esc(rel.label || REL[rel.kind] || 'Related')}</span>${rel.note ? `<span class="rel-note">${esc(rel.note)}</span>` : ''}${rel.decision ? `<span class="rel-note"><strong>${esc(rel.decision)}</strong></span>` : ''}`
    : `<span class="seal s-${r.status}">${RINGS(r.status === 'pending' ? 'dashed' : r.status === 'force' || r.status === 'repeal' ? 'filled' : '')}${seal}</span>`
      + (r.status === 'pending' ? `<span class="rel-note">Waiting for ${esc(listJoin(waiting.map(firstName)))}</span>`
        : r.status === 'scheduled' ? `<span class="rel-note">Everyone has signed</span>`
        : r.effectiveAt && r.status !== 'superseded' && r.status !== 'repealed' ? `<span class="rel-note">Since ${esc(fmtWhen(r.effectiveAt))}</span>` : '');
  const cls = ['entry', past && 'past', r.status === 'force' && 'force', r.status === 'pending' && 'pending', r.kind === 'repeal' && 'is-repeal', isLatest && 'latest', rel && rel.kind === 'contradicts' && 'rel-clash', rel && rel.kind === 'focus' && 'focused'].filter(Boolean).join(' ');
  return `<article class="${cls}" id="e-${esc(r.id)}">
    ${laneHTML(r, prev, next)}
    <div class="date"><b class="sec">${fol(r.n)}</b><time datetime="${esc(r.createdAt)}" title="${esc(fmtTime(r.createdAt))}">${esc(fmtDate(r.createdAt))}</time>${isLatest ? '<span class="pill-tag latest">Latest</span>' : ''}</div>
    <div class="e-body">
      <h2 class="e-title"><button type="button" class="title-btn" data-act="focus" data-id="${esc(r.id)}" title="Show the rules connected to § ${fol(r.n)}">${esc(str(r.title) || 'Untitled')}</button></h2>
      <p class="e-text">${richText(r.text, rel)}</p>
      ${pendingNote}
      ${links.length ? `<div class="e-links">${links.join('')}</div>` : ''}
      <div class="e-meta"><span>Written by ${esc(nameOf(r.authorId))}</span>${r.effectiveOn ? `<span>Effective from ${esc(fmtDay(r.effectiveOn))}</span>` : ''}</div>
      ${agreementsHTML(r)}
      ${rel && rel.kind !== 'focus' ? '' : whyHTML(r)}
      ${actions.length ? `<div class="e-actions">${actions.join('')}</div>` : ''}
      ${S.signing === r.id && mine ? `<div class="row-sign">${signFields('es', `I intend to be legally bound by § ${fol(r.n)} of “${S.ledger.name}” exactly as written (fingerprint ${shortHash(r.hash)})${r.effectiveOn ? `, effective from ${fmtDay(r.effectiveOn)}` : ''}${S.ledger.governingLaw ? `, under ${S.ledger.governingLaw}` : ''}. I am signing electronically.`, 'entry:' + r.id)}
        <div class="row"><button type="button" class="btn primary" data-act="sign-entry" data-id="${esc(r.id)}">${RINGS()}Sign § ${fol(r.n)}</button><button type="button" class="btn link" data-act="cancel-sign">Cancel</button></div></div>` : ''}
    </div>
    <div class="e-status">${status}</div>
  </article>`;
}

function whyHTML(r) {
  const cl = arr(r.clarifications).filter(c => c && typeof c === 'object');
  const cf = arr(r.relations).concat(arr(r.conflicts)).filter(c => c && typeof c === 'object' && L.byId.get(c.ruleId));
  const ec = arr(r.edgeCases).map(str).filter(Boolean);
  const draft = str(r.draft);
  const showDraft = draft && draft !== str(r.text);
  if (!cl.length && !cf.length && !ec.length && !showDraft) return '';
  const res = c => DECIDE[c.resolution] || RES[c.resolution] || '';
  return `<details class="why" data-id="${esc(r.id)}"${S.open.has(r.id) ? ' open' : ''}>
    <summary>How we got here${ec.length ? ` · ${ec.length} edge case${ec.length > 1 ? 's' : ''} added` : cl.length ? ` · ${cl.length} point${cl.length > 1 ? 's' : ''} settled` : ''}</summary>
    <div class="why-body">
      ${showDraft ? `<div><h4>First draft</h4><p class="draft">${esc(draft)}</p></div>` : ''}
      ${ec.length ? `<div><h4>Edge cases added</h4><ul class="qa">${ec.map(c => `<li><p class="qa-a">${esc(c)}</p></li>`).join('')}</ul></div>` : ''}
      ${cl.length ? `<div><h4>Settled along the way</h4><ol class="qa">${cl.map(c => `<li><span class="tag t-${esc(c.type)}">${esc(TYPE[c.type] || 'Question')}</span><p class="qa-q">${esc(str(c.q))}</p><p class="qa-a">${esc(str(c.a))}</p></li>`).join('')}</ol></div>` : ''}
      ${cf.length ? `<div><h4>Checked against earlier rules</h4><ul class="cf">${cf.map(c => `<li>${refBtn(L.byId.get(c.ruleId), REL[c.kind] || KIND[c.kind] || 'Related to')}<span>${esc(str(c.explanation))}</span>${res(c) ? `<em>${esc(res(c))}</em>` : ''}</li>`).join('')}</ul></div>` : ''}
    </div>
  </details>`;
}

function jump(id) {
  if (!L.byId.has(id)) return;
  if (!document.getElementById('e-' + id)) {
    S.filter = 'all'; S.q = ''; S.focus = null; S.showAll = true; $('#q').value = ''; syncFilter(); renderLedger();
  }
  const el = document.getElementById('e-' + id);
  if (!el) return;
  el.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'center' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
/* Colour scheme: 'auto' follows the system; 'light' or 'dark' is remembered on this device. */
function setTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  else { t = 'auto'; delete document.documentElement.dataset.theme; }
  try { if (t === 'auto') localStorage.removeItem('handshake.theme'); else localStorage.setItem('handshake.theme', t); } catch (e) {}
  document.querySelectorAll('[data-act="theme"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === t)));
}
setTheme(document.documentElement.dataset.theme || 'auto');
function syncFilter() {
  document.querySelectorAll('[data-act="filter"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === S.filter)));
}

/* ---------- composer ---------- */
// A conflict in force that still needs a decision: supersede it, or keep it.
const undecided = () => D.related.filter(r => r.kind === 'contradicts' && !D.resolve[r.ruleId] && !D.supersedes.includes(r.ruleId)
  && L.byId.get(r.ruleId) && L.byId.get(r.ruleId).status === 'force');

// What a draft is, in words: for the composer's heading and for the choice between two drafts.
const draftWhat = d => { const t = L.byId.get((d.supersedes || [])[0]);
  return d.mode === 'repeal' ? `repeal of § ${t ? fol(t.n) : '?'}` : d.amending && t ? `${t.status === 'pending' ? 'change to' : 'amendment of'} § ${fol(t.n)}` : 'new rule'; };
const sameDraft = (a, b) => (a.mode || 'rule') === (b.mode || 'rule') && (a.amending || null) === (b.amending || null) && String((a.supersedes || [])[0] || '') === String((b.supersedes || [])[0] || '');
function openComposer(preset) {
  if (!S.ledger) return;
  // One draft per agreement. A different action replaces a draft nobody has edited; an edited one is kept and the
  // composer asks whether to discard it.
  T.swap = null;
  if (preset && !sameDraft(D, preset)) {
    if (draftHasContent() && D.touched) T.swap = preset;
    else { D = Object.assign(blankDraft(), preset); saveDraft(); }
  }
  T.discardArm = false; S.showAll = false; S.focus = null;
  $('#draft').hidden = false;
  renderLedger();
  renderComposer();
  ($(D.mode === 'repeal' ? '#d-reason' : '#d-text') || $('#draft-head button')).focus({ preventScroll: true });
  $('#draft').scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });
}
function closeComposer() {
  saveDraft(); T.swap = null;
  $('#draft').hidden = true; S.showAll = false;
  renderLedger();
}
const isTyping = () => { const a = document.activeElement; return !!(a && $('#draft').contains(a) && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName)); };

function renderComposer() {
  if ($('#draft').hidden) return;
  derive();
  const next = fol(L.list.length + 1);
  $('#draft-num').textContent = next;
  const what = draftWhat(D), target = L.byId.get(D.supersedes[0]);
  const title = D.mode === 'repeal' ? `Repeal § ${target ? fol(target.n) : ''}` : D.amending && target ? `${target.status === 'pending' ? 'Suggest a change to' : 'Amend'} § ${fol(target.n)}` : 'Write a rule';
  $('#draft-head').innerHTML = `<div><p class="eyebrow">${RINGS()}§ ${next} · ${D.mode === 'repeal' ? 'Repeal' : D.amending ? (target && target.status === 'pending' ? 'Suggested change' : 'Amendment') : 'New rule'}</p><h2 id="draft-title">${esc(title)}</h2></div>
    <button type="button" class="icon-btn" data-act="close" aria-label="Put the draft away. It is kept.">×</button>
    ${T.swap ? `<div class="banner swap" role="alert"><p>You have an unsaved ${esc(what)}.</p><div class="row"><button type="button" class="btn small primary" data-act="swap-draft">Discard it and start the ${esc(draftWhat(T.swap))}</button><button type="button" class="btn link" data-act="keep-draft">Keep editing it</button></div></div>` : ''}`;
  $('#draft-body').innerHTML = D.mode === 'repeal' ? repealHTML() : ruleHTML();
  renderFoot();
}

const elapsed = () => T.started ? ((Date.now() - T.started) / 1000).toFixed(1) + 's' : '';
const thinkingHTML = () => `<div class="thinking" role="status"><svg class="pen" viewBox="0 0 30 12" aria-hidden="true"><circle cx="10" cy="6" r="5"/><circle cx="20" cy="6" r="5"/></svg><span>Checking against the agreement…</span><span id="ai-elapsed" class="stats">${elapsed()}</span><button type="button" class="btn link" data-act="stop">Stop</button></div>`;

function ruleHTML() {
  const amend = D.amending && L.byId.get(D.amending);
  const stale = D.checked && str(D.text) !== D.checkedText;
  let h = '';
  if (amend) h += amend.status === 'pending'
    ? `<p class="banner">Suggesting a change to § ${fol(amend.n)}, “${esc(str(amend.title))}”. If everyone agrees to your version, it replaces § ${fol(amend.n)}, which stays in the agreement.</p>`
    : `<p class="banner">Amending § ${fol(amend.n)}, “${esc(str(amend.title))}”. When you save, § ${fol(amend.n)} is marked as replaced. It stays in the agreement.</p>`;

  h += `<section class="step"><h3><span class="stepno">1</span>Write the rule</h3>
    <label class="field"><span class="lbl">Wording</span>
      <textarea id="d-text" class="prose" rows="5" placeholder="e.g. Whoever cooks dinner doesn’t do the dishes.">${esc(D.text)}</textarea></label>
    <label class="field"><span class="lbl">Title</span><input type="text" id="d-title" value="${esc(D.title)}" placeholder="${D.checked ? 'A short name' : 'Optional. The check suggests one.'}" maxlength="80"></label>
    ${binding() ? effectiveField('rule') : ''}
    ${S.ai ? `<div class="row">${T.busy ? thinkingHTML() : `<button type="button" id="check1" class="btn${D.checked && !stale ? '' : ' primary'}" data-act="check"${str(D.text) ? '' : ' disabled'}>${RINGS()}${D.checked ? 'Check again' : 'Check rule'}</button><span class="hint">Finds related rules and conflicts, and suggests edge cases.</span>`}</div>`
      : `<p class="hint">Rule checks need the local server started with a GROQ_API_KEY. You can still write and save rules.</p>`}
    ${T.error ? `<p class="err" role="alert">${esc(T.error)}</p>` : ''}
  </section>`;

  if (D.checked) {
    const conflicts = D.related.filter(r => r.kind === 'contradicts');
    const others = D.related.filter(r => r.kind !== 'contradicts');
    h += `<section class="step" id="found"><h3><span class="stepno">2</span>Related rules</h3>
      ${stale ? `<p class="hint">You’ve changed the wording since this check. Check again to update it.</p>` : ''}
      ${!D.related.length ? `<p class="ok-note">${RINGS('filled')}No rules in force touch this one.</p>` : ''}
      ${conflicts.length ? `<ul class="conflicts">${conflicts.map(conflictHTML).join('')}</ul>` : ''}
      ${others.length ? `<ul class="cf">${others.map(r => { const t = L.byId.get(r.ruleId); return t ? `<li><span><span class="rel r-${esc(r.kind)}">${esc(REL[r.kind])}</span> ${refBtn(t, '')} ${esc(str(t.title))}</span><span class="hint">${esc(r.explanation)}</span></li>` : ''; }).join('')}</ul>
        <p class="hint">These are linked to the new rule when you save.</p>` : ''}
    </section>`;
    h += `<section class="step" id="edges"><h3><span class="stepno">3</span>Edge cases</h3>
      ${D.edges.length ? `<p class="hint">Tick the ones to settle in the rule. Each adds its sentence to the wording, which you can edit.</p>
        <ul class="edges">${D.edges.map((e, i) => `<li><label class="edge${D.include[i] ? ' on' : ''}"><input type="checkbox" data-edge="${i}"${D.include[i] ? ' checked' : ''}><span><span class="edge-sit">${esc(e.situation)}</span><span class="edge-clause">${esc(e.clause)}</span></span></label></li>`).join('')}</ul>`
        : `<p class="ok-note">${RINGS('filled')}No edge cases worth settling.</p>`}
    </section>`;
  }
  return h;
}

function conflictHTML(c) {
  const r = L.byId.get(c.ruleId);
  if (!r) return '';
  const res = D.resolve[c.ruleId], n = fol(r.n);
  const has = (t, q) => q && str(t).toLowerCase().includes(q.toLowerCase());
  const cmp = c.quoteOld || c.quoteNew ? `<div class="cmp">
      ${c.quoteOld ? `<div><span class="sc">§ ${n} says</span>${has(r.text, c.quoteOld) ? `…<mark class="clash">${esc(c.quoteOld)}</mark>…` : esc(c.quoteOld)}</div>` : ''}
      ${c.quoteNew ? `<div><span class="sc">Your rule says</span>${has(D.text, c.quoteNew) ? `…<mark class="clash">${esc(c.quoteNew)}</mark>…` : esc(c.quoteNew)}</div>` : ''}
    </div>` : '';
  return `<li class="conflict${res ? ' done' : ''}">
    <div class="c-top"><span class="tag t-conflict">Conflicts with § ${n}</span><span class="c-title">${esc(str(r.title))}</span></div>
    <p>${esc(c.explanation)}</p>
    ${cmp}
    <div class="opts" role="group" aria-label="What happens to § ${n}">
      <button type="button" class="opt" data-act="resolve" data-id="${esc(r.id)}" data-res="supersede" aria-pressed="${res === 'supersede'}">Supersede § ${n}</button>
      <button type="button" class="opt" data-act="resolve" data-id="${esc(r.id)}" data-res="keep" aria-pressed="${res === 'keep'}">Keep § ${n} in force</button>
    </div>
  </li>`;
}

function repealHTML() {
  const t = L.byId.get(D.supersedes[0]);
  if (!t) return `<p class="hint">The rule you chose to repeal isn’t in the agreement.</p>`;
  return `<section class="step"><h3>§ ${fol(t.n)} · ${esc(str(t.title))}</h3>
    <p class="quoted">${marked(str(t.text))}</p>
    <p class="hint">A repeal is its own entry. § ${fol(t.n)} stays in the agreement, marked as repealed, and stops being in force.</p>
    <label class="field"><span class="lbl">Why, in a sentence (optional)</span><textarea id="d-reason" rows="3" placeholder="e.g. We hired a cleaner, so the rota no longer applies.">${esc(D.reason)}</textarea></label>
    ${binding() ? effectiveField('repeal') : ''}
  </section>`;
}
// Legally binding agreements only: the date a rule (or repeal) takes effect, signed along with its text.
const effectiveField = what => `<label class="field eff"><span class="lbl">Effective date (optional)</span><input type="date" id="d-effective" value="${esc(D.effectiveOn)}"></label>
    <p class="hint">Leave it empty and the ${what} takes effect once everyone has signed. With a date, it takes effect on that day, or when the last person signs if that’s later. The date is part of what everyone signs.</p>`;

function renderFoot() {
  const f = $('#draft-foot');
  if ($('#draft').hidden) return;
  const block = [], note = [];
  if (D.mode === 'repeal') {
    if (!L.byId.get(D.supersedes[0])) block.push('Nothing to repeal.');
  } else {
    if (!str(D.text)) block.push('Write the rule first.');
    for (const c of undecided()) block.push(`Choose whether § ${fol(L.byId.get(c.ruleId).n)} is superseded or stays in force.`);
    if (S.ai && !D.checked && str(D.text)) note.push('Not checked yet. You can save anyway.');
    if (/\[[^\]\n]+\]/.test(D.text)) note.push('The wording still has [bracketed] blanks.');
    if (S.members.length > 1) note.push(`${binding() ? 'Saving signs it.' : 'Saving counts as your agreement.'} It comes into effect when ${listJoin(S.members.filter(m => m.id !== S.me).map(m => m.name.split(/\s+/)[0]))} ${binding() ? 'sign' : 'agree'}${S.members.length > 2 ? '' : 's'} too.`);
  }
  if (binding() && !mySignedLedger()) block.push('This agreement is legally binding. Sign the agreement before writing rules in it.');
  const disabled = block.length || T.saving || T.busy;
  const sign = binding() && mySignedLedger() ? signFields('ds', `I intend to be legally bound by this ${D.mode === 'repeal' ? 'repeal' : 'rule'} (§ ${fol(L.list.length + 1)} of “${S.ledger.name}”) exactly as written${D.effectiveOn ? `, effective from ${fmtDay(D.effectiveOn)}` : ''}${S.ledger.governingLaw ? `, under ${S.ledger.governingLaw}` : ''}. I am signing electronically.`, 'new') : '';
  const keep = keepSigFields('ds');
  f.innerHTML = `${sign}${block.length || note.length ? `<ul class="foot-notes">${block.map(b => `<li class="b">${esc(b)}</li>`).join('')}${note.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}
    <div class="foot-row">
      <button type="button" class="btn link danger" data-act="discard">${T.discardArm ? 'Click again to discard' : 'Discard draft'}</button>
      <button type="button" class="btn primary" data-act="record"${disabled ? ' disabled' : ''}>${RINGS()}${T.saving ? 'Saving…' : `${binding() ? 'Sign and ' : ''}${D.mode === 'repeal' ? 'record repeal' : 'save'} as § ${fol(L.list.length + 1)}`.replace(/^./, c => c.toUpperCase())}</button>
    </div>
    ${binding() && !mySignedLedger() ? `<button type="button" class="btn" data-act="sign-ledger-view">Review and sign the agreement</button>` : ''}`;
  restoreSigFields('ds', keep);
}

/* ---------- the check (a fast model behind the local server) ---------- */
function buildPrompt() {
  const force = inForce();
  const P = [];
  P.push(`You help two or more people keep an agreement: the rules they have all accepted on one topic. They might be partners, housemates, family, friends, business partners or any other group; take the setting from their words. Check one new rule against their agreement. Be neutral: don't judge whether the rule is a good idea.`);
  P.push(`NEW RULE:\n"""\n${str(D.text).slice(0, 6000)}\n"""`);
  const rep = D.supersedes.map(id => L.byId.get(id)).filter(Boolean);
  if (rep.length) P.push(`This new rule is meant to replace ${rep.map(r => '§ ' + r.n).join(', ')}, so differences from it are expected; don't report it as a conflict.`);
  P.push(force.length
    ? `RULES IN FORCE:\n\n${force.map(r => `§ ${r.n} — ${str(r.title)}:\n${str(r.text).slice(0, 1500)}`).join('\n\n')}`
    : `RULES IN FORCE: none.`);
  P.push(`TASKS
1. related: every rule in force that the new rule touches. "kind" is "contradicts" (both can't be followed as written), "overlaps" (they cover the same situation and it's unclear which governs), "refines" (the new rule narrows or adds detail to it) or "related" (same subject, no tension). Copy the exact words that matter: "quoteExisting" character-for-character from that rule and "quoteNew" character-for-character from the new rule, a short phrase each. Leave out rules about other subjects.
2. edgeCases: up to 5 concrete, realistic situations where the people could honestly disagree about whether the rule applies or was kept (illness, travel, guests, emergencies, money, someone away, someone new joining, and so on). Only ones that matter for this rule and that its wording doesn't already settle. For each, "clause" is one short sentence they could add to the rule to settle it, in the rule's own voice, with a sensible, neutral default.
3. title: a short name for the new rule, at most 6 words.

Reply with only this JSON:
{"title": "...", "related": [{"rule": 3, "kind": "contradicts", "explanation": "one sentence", "quoteExisting": "...", "quoteNew": "..."}], "edgeCases": [{"situation": "one short sentence", "clause": "the sentence to add"}]}`);
  return P.join('\n\n');
}

function normalize(r) {
  r = r && typeof r === 'object' && !Array.isArray(r) ? r : {};
  const byN = new Map(inForce().map(x => [x.n, x]));
  const seen = new Set(), related = [];
  for (const c of arr(r.related)) {
    const t = byN.get(Number(String(c && c.rule).replace(/\D/g, '')));
    if (!t || seen.has(t.id) || D.supersedes.includes(t.id)) continue;
    seen.add(t.id);
    related.push({ ruleId: t.id, kind: REL[c.kind] && !['replaces', 'repeals'].includes(c.kind) ? c.kind : 'related', explanation: str(c.explanation),
      quoteOld: str(c.quoteExisting).slice(0, 300), quoteNew: str(c.quoteNew).slice(0, 300) });
  }
  const edges = arr(r.edgeCases).map(e => ({ situation: str(e && e.situation), clause: str(e && e.clause) }))
    .filter(e => e.situation && e.clause).slice(0, 5);
  return { title: str(r.title).slice(0, 80), related, edges };
}

function aiMsg(e) {
  const c = e && e.code;
  if (c === 'no_key') return 'Rule checks are off: start the server with GROQ_API_KEY set.';
  if (c === 'rate_limited') return 'The checking service is busy right now. Wait a moment and try again.';
  if (c === 'invalid_json' || c === 'empty_completion') return 'The check came back incomplete. Try again.';
  if (e && e.message) return `The check didn’t work: ${e.message.slice(0, 200)}`;
  return 'Couldn’t run the check just now. Try again.';
}

async function check() {
  if (T.busy || !S.ai || !str(D.text)) return;
  const ctl = T.ctl = new AbortController();
  T.busy = true; T.error = ''; T.started = Date.now();
  const tick = setInterval(() => { const el = $('#ai-elapsed'); if (el) el.textContent = elapsed(); }, 100);
  renderComposer();
  try {
    const res = normalize(await S.ai.json(buildPrompt(), { signal: ctl.signal }));
    D.related = res.related;
    // Keep a decision only for a conflict the new check still reports.
    D.resolve = Object.fromEntries(Object.entries(D.resolve).filter(([id]) => res.related.some(r => r.ruleId === id && r.kind === 'contradicts')));
    D.edges = res.edges;
    D.include = {};
    res.edges.forEach((e, i) => { if (D.text.includes(e.clause)) D.include[i] = true; });
    if (!D.titleTouched && res.title) D.title = res.title;
    if (!D.firstText) D.firstText = str(D.text);
    D.checked = true; D.checkedText = str(D.text);
    S.showAll = false;
  } catch (e) {
    if (!e || e.code !== 'cancelled') T.error = aiMsg(e);
  } finally {
    clearInterval(tick);
    T.busy = false; T.ctl = null; T.started = 0;
    saveDraft();
    renderLedger();
    renderComposer();
  }
}

/* Ticking an edge case adds its sentence to the wording; unticking takes it out again. */
function toggleEdge(i, on) {
  D.touched = true;
  const e = D.edges[i];
  if (!e) return;
  const fresh = D.checked && str(D.text) === D.checkedText;
  if (on) {
    if (!D.text.includes(e.clause)) D.text = D.text.replace(/\s*$/, '') + (D.text.trim() ? '\n' : '') + e.clause;
    D.include[i] = true;
  } else {
    D.text = D.text.replace('\n' + e.clause, '').replace(e.clause, '').replace(/\s+$/, '');
    delete D.include[i];
  }
  if (fresh) D.checkedText = str(D.text); // ticking a suggestion doesn't make the check out of date
  saveDraft();
  const t = $('#d-text'); if (t) t.value = D.text;
  renderComposer();
}

/* ---------- server ---------- */
async function api(method, url, body, signal) {
  let r;
  try {
    r = await fetch(url, { method, signal, headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  } catch (e) {
    throw { code: e && e.name === 'AbortError' ? 'cancelled' : 'unavailable', message: 'The Handshake server isn’t reachable. Check that it’s still running.' };
  }
  const out = await r.json().catch(() => ({}));
  if (r.status === 401) { S.signIn = out.signIn !== false; showGate('signed-out'); }
  if (!r.ok) throw { code: out.code || 'unavailable', message: out.message };
  return out;
}
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 12);

async function record() {
  if (T.saving || !S.ledger) return;
  let doc;
  if (D.mode === 'repeal') {
    const t = L.byId.get(D.supersedes[0]);
    if (!t) return;
    doc = { kind: 'repeal', title: `Repeal of § ${fol(t.n)}, ${str(t.title)}`.slice(0, 120), text: str(D.reason) || 'Repealed by agreement.', supersedes: [t.id] };
    if (binding() && D.effectiveOn) doc.effectiveOn = D.effectiveOn;
  } else {
    const text = str(D.text);
    if (!text) return;
    const sup = [...new Set([...D.supersedes, ...D.related.filter(r => D.resolve[r.ruleId] === 'supersede').map(r => r.ruleId)])];
    doc = { kind: 'rule', title: str(D.title) || text.split(/\s+/).slice(0, 6).join(' '), text,
      draft: D.firstText && D.firstText !== text ? D.firstText : '',
      relations: D.related.map(r => ({ ruleId: r.ruleId, kind: r.kind, explanation: r.explanation, quoteOld: r.quoteOld, quoteNew: r.quoteNew, resolution: D.resolve[r.ruleId] || '' })),
      edgeCases: D.edges.filter((_, i) => D.include[i]).map(e => e.clause),
      supersedes: sup, relates: D.related.map(r => r.ruleId).filter(id => !sup.includes(id)) };
    if (binding() && D.effectiveOn) doc.effectiveOn = D.effectiveOn;
  }
  const sig = binding() ? readSignature('ds') : {};
  if (!sig) return;
  T.saving = true; renderFoot();
  try {
    // One id per draft, so retrying after a slow save can't record the entry twice (and an emailed code matches it).
    if (!D.entryId) { D.entryId = newId(); saveDraft(); }
    const id = D.entryId;
    await api('POST', `/api/ledgers/${S.ledger.id}/entries`, Object.assign({ id, doc }, sig));
    const from = doc.effectiveOn && doc.effectiveOn > new Date().toISOString().slice(0, 10) ? ` It takes effect on ${fmtDay(doc.effectiveOn)}${S.members.length > 1 ? ', once everyone has signed' : ''}.` : '';
    D = blankDraft(); saveDraft();
    S.pendingJump = id;
    S.filter = 'all'; S.q = ''; S.focus = null; $('#q').value = ''; syncFilter();
    closeComposer();
    await refresh();
    toast(from ? `Signed and saved.${from}` : S.members.length > 1 ? `${binding() ? 'Signed and saved' : 'Saved'}. It comes into effect when everyone has ${binding() ? 'signed' : 'agreed'}.` : `${binding() ? 'Signed and saved' : 'Saved'}, and in effect.`);
  } catch (e) {
    toast(e.message || 'Couldn’t save just now. Your draft is kept; try again.');
  } finally {
    T.saving = false; renderFoot();
  }
}

async function agree(id) {
  if (!S.ledger) return;
  try {
    await api('POST', `/api/ledgers/${S.ledger.id}/entries/${encodeURIComponent(id)}/agree`, {});
    await refresh();
    const r = L.byId.get(id);
    toast(r && r.effective ? `§ ${fol(r.n)} is now in effect.` : 'Your agreement is recorded.');
  } catch (e) { toast(e.message || 'Couldn’t record your agreement. Try again.'); }
}

async function signEntry(id) {
  const r = L.byId.get(id);
  const sig = readSignature('es');
  if (!r || !sig) return;
  try {
    await api('POST', `/api/ledgers/${S.ledger.id}/entries/${encodeURIComponent(id)}/agree`, Object.assign({ entryHash: r.hash }, sig));
    S.signing = null;
    await refresh();
    const now = L.byId.get(id);
    toast(now && now.effective ? `Signed. § ${fol(now.n)} is now in effect.` : now && now.scheduled ? `Signed by everyone. § ${fol(now.n)} takes effect on ${fmtDay(now.effectiveOn)}.` : 'Signed.');
  } catch (e) { toast(e.message || 'Couldn’t sign just now. Try again.'); if (e.code === 'stale') refresh().catch(() => {}); }
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3600);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act !== 'discard' && T.discardArm) { T.discardArm = false; renderFoot(); }
  switch (act) {
    case 'new': openComposer(); break;
    case 'close': closeComposer(); break;
    case 'check': check(); break;
    case 'stop': if (T.ctl) T.ctl.abort(); break;
    case 'resolve':
      D.resolve[id] = b.dataset.res;
      saveSoon(); renderLedger(); renderComposer(); break;
    case 'record': record(); break;
    case 'swap-draft': if (T.ctl) T.ctl.abort(); D = Object.assign(blankDraft(), T.swap); T.swap = null; T.error = ''; saveDraft(); renderLedger(); renderComposer(); break;
    case 'keep-draft': T.swap = null; renderComposer(); break;
    case 'discard':
      if (T.discardArm) {
        if (T.ctl) T.ctl.abort();
        T.discardArm = false; T.error = '';
        D = blankDraft(); saveDraft(); closeComposer(); toast('Draft discarded.');
      } else { T.discardArm = true; renderFoot(); }
      break;
    case 'goto': jump(id); break;
    case 'agree': agree(id); break;
    case 'amend': {
      const r = L.byId.get(id); if (!r) break;
      if (S.view !== 'ledger') setView('ledger', 'replace');
      openComposer({ text: str(r.text), title: str(r.title), titleTouched: true, supersedes: [r.id], amending: r.id });
      break;
    }
    case 'repeal': if (S.view !== 'ledger') setView('ledger', 'replace'); openComposer({ mode: 'repeal', supersedes: [id] }); break;
    case 'new-ledger': showPanel('new-ledger'); break;
    case 'open-ledger': openLedger(b.dataset.id, 'push'); break;
    case 'create-ledger': createLedger(); break;
    case 'settings': if (drafting()) closeComposer(); setView('settings'); break;
    case 'back': leaveView(); break;
    case 'save-settings': saveSettings(); break;
    case 'sign-ledger-view': if (drafting()) closeComposer(); setView('sign'); break;
    case 'sign-ledger': signLedger(); break;
    case 'accept-agreement': acceptAgreement(); break;
    case 'open-sign': S.signing = id; renderLedger(); { const n = $('#es-name'); if (n) n.focus(); } break;
    case 'cancel-sign': S.signing = null; renderLedger(); break;
    case 'sign-entry': signEntry(id); break;
    case 'send-code': sendCode(b.dataset.purpose, b.dataset.prefix); break;
    case 'save-verify': saveVerify(); break;
    case 'leave': leaveLedger(); break;
    case 'invite': invite(); break;
    case 'email-invite': emailInvite(); break;
    case 'copy-invite': { const i = $('#invite-url'); if (i) { i.select(); navigator.clipboard && navigator.clipboard.writeText(i.value).then(() => toast('Invite link copied.'), () => {}); } break; }
    case 'close-panel': showPanel(null); break;
    case 'sign-out': signOut(); break;
    case 'accept-invite': acceptInvite(); break;
    case 'decline-invite': leaveInvite(); break;
    case 'filter': S.filter = b.dataset.f; syncFilter(); renderLedger(); break;
    case 'order': S.newest = !S.newest; syncFilter(); renderLedger(); break;
    case 'theme': setTheme(b.dataset.t); break;
    case 'show-all': S.showAll = true; renderLedger(); break;
    case 'show-related': S.showAll = false; renderLedger(); break;
    case 'focus':
      if (drafting()) break;
      S.focus = S.focus === id ? null : id; S.showAll = false; renderLedger();
      { const el = document.getElementById('e-' + id); if (el) el.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'center' }); }
      break;
    case 'unfocus': S.focus = null; S.showAll = false; renderLedger(); { const el = document.getElementById('e-' + id); if (el) el.scrollIntoView({ block: 'center' }); } break;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; renderLedger(); return; }
  if (!$('#draft').contains(t)) return;
  if (/^d-/.test(t.id)) D.touched = true;
  if (t.id === 'd-text') { D.text = t.value; const b = $('#check1'); if (b) b.disabled = !str(t.value); }
  else if (t.id === 'd-title') { D.title = t.value; D.titleTouched = true; }
  else if (t.id === 'd-reason') D.reason = t.value;
  else if (t.id === 'd-effective') D.effectiveOn = t.value;
  else return;
  saveSoon(); renderFoot();
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('input[data-edge]')) toggleEdge(+t.dataset.edge, t.checked);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && drafting() && !isTyping()) closeComposer();
  else if (e.key === 'Escape' && S.focus && !drafting()) { S.focus = null; renderLedger(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && e.target.id === 'd-text') check();
  if (e.key === 'Enter' && e.target.id === 'ledger-name') createLedger();
  if (e.key === 'Enter' && e.target.id === 'invite-email') emailInvite();
});

$('#ledger').addEventListener('toggle', e => {
  const d = e.target;
  if (d.matches && d.matches('details.why')) { if (d.open) S.open.add(d.dataset.id); else S.open.delete(d.dataset.id); }
}, true);

/* ---------- boot ---------- */
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
function toLatest(behavior) {
  if (S.newest) return;
  window.scrollTo({ top: document.documentElement.scrollHeight, behavior: reduced() ? 'auto' : behavior });
}
function onData() {
  const before = L.list.length;
  const atBottom = innerHeight + scrollY >= document.documentElement.scrollHeight - 160;
  renderLedger();
  if (S.loaded && !S.scrolled && L.list.length) {
    // Open at the latest entry; again once the web fonts have settled the page height.
    S.scrolled = true;
    const go = () => { if (!drafting()) toLatest('auto'); };
    requestAnimationFrame(go);
    if (document.fonts) document.fonts.ready.then(() => requestAnimationFrame(go));
  }
  else if (L.list.length > before && atBottom && !drafting() && !S.pendingJump) requestAnimationFrame(() => toLatest('smooth'));
  if (drafting() && !isTyping()) renderComposer();
  if (S.pendingJump && L.byId.has(S.pendingJump)) { const id = S.pendingJump; S.pendingJump = null; requestAnimationFrame(() => jump(id)); }
}

/* The binding bar under the toolbar, and the settings / sign-the-ledger views that replace the ledger. */

/* Each agreement and view has its own address (/?l=<agreement>&v=settings|sign), so Back and Forward move within
   Handshake. 'push' records a step someone took, 'replace' corrects the current entry, 'none' follows the address. */
function remember(how) {
  if (how === 'none') return;
  const p = new URLSearchParams();
  if (S.ledger) p.set('l', S.ledger.id);
  if (S.view !== 'ledger') p.set('v', S.view);
  const u = '/?' + p;
  if (u === location.pathname + location.search) return;
  const state = { hs: 1, back: how === 'push' && S.view !== 'ledger' };
  if (how === 'push') history.pushState(state, '', u); else history.replaceState(state, '', u);
}
// Leave settings or signing for the agreement: step back if we came from it, otherwise just show it.

  if (history.state && history.state.back) history.back(); else setView('ledger', 'replace');
}

  if (S.ledger) setView(v === 'settings' || v === 'sign' ? v : 'ledger', 'none');

      </section>
      ${binding() ? `<section class="card"><h3>Confirming signatures</h3>
        ${owner ? `<label class="check"><input type="checkbox" id="set-verify"${S.ledger.verifyEmail ? ' checked' : ''}><span>Confirm every signature with a six-digit code emailed to the signer’s Google address</span></label>
          <div class="row"><button type="button" class="btn" data-act="save-verify">Save</button></div>`
          : `<p>${S.ledger.verifyEmail ? 'Every signature here is confirmed with a code emailed to the signer.' : 'Signatures here are confirmed by Google sign-in.'}</p>`}
        <p class="hint">Every signature’s certificate records how it was confirmed and when the signer last signed in with Google. ${S.mail === 'outbox' ? 'Email isn’t set up on this server yet, so codes and certificates are saved to its outbox instead of being sent.' : 'When everyone has signed a rule, each of you is emailed its certificate.'}</p></section>` : ''}
      ${binding() ? `<section class="card"><h3>Agreement signatures</h3><ul class="sig-list">${S.members.map(m => { const s = sigFor(m.id); return `<li>${RINGS(s ? 'filled' : 'dashed')}<span class="who">${esc(m.name)}</span><span class="when">${s ? `Signed as “${esc(s.typedName)}”, ${esc(fmtWhen(s.at))}, covering ${s.entryCount} entr${s.entryCount === 1 ? 'y' : 'ies'}` : 'Hasn’t signed yet'}</span></li>`; }).join('')}</ul>
        ${mySignedLedger() ? '' : `<div class="row"><button type="button" class="btn primary" data-act="sign-ledger-view">${RINGS()}Review and sign the agreement</button></div>`}
        <p><a href="/certificate/${esc(S.ledger.id)}" target="_blank" rel="noopener">Agreement certificate</a> <span class="dim">· print it or save it as a PDF</span></p></section>` : ''}
      ${owner ? '' : `<section class="card"><h3>Leave this agreement</h3><p class="hint">You’ll stop seeing it, and new rules won’t need you. Everything you’ve signed or agreed to stays on record.</p>
        <div class="row"><button type="button" class="btn" data-act="leave">${T.leaveArm ? 'Click again to leave' : 'Leave agreement'}</button></div></section>`}
      <section class="card"><h3>Integrity</h3><p id="integrity" class="hint">Checking the agreement’s fingerprints…</p>
        <p class="hint">Current fingerprint <code>${esc(shortHash(S.ledger.head))}</code> over ${S.ledger.headCount} entr${S.ledger.headCount === 1 ? 'y' : 'ies'}.</p></section>`;
    api('GET', `/api/ledgers/${S.ledger.id}/verify`).then(r => { const el = $('#integrity'); if (el) el.innerHTML = r.ok
      ? `${RINGS('filled')} Every fingerprint matches its recorded content and order (${r.count} entr${r.count === 1 ? 'y' : 'ies'}).`
      : `<strong class="bad">The stored history doesn’t match its fingerprints at entry ${esc(r.brokenAt)}.</strong> Something changed it outside Handshake.`; }).catch(() => {});
  } else if (S.view === 'sign' && !binding()) {
    const rules = toAccept(S.me);
    v.innerHTML = `<div class="view-head"><h2 class="soft">Agree to “${esc(S.ledger.name)}”</h2><button type="button" class="btn link" data-act="back">Back to the agreement</button></div>
      <section class="card"><h3>What you’re agreeing to</h3>
        <p>The ${rules.length} rule${rules.length === 1 ? '' : 's'} everyone had agreed to when you joined. Rules written from now on need your agreement one by one, as they do everyone’s.</p>
        ${reviewList(rules)}
        <p class="hint">If something doesn’t work for you, suggest a change or a repeal first. Everyone sees it and can agree to it.</p>
        ${waitingList(waitingForMe(), 'agree')}
        <div class="row"><button type="button" class="btn primary" data-act="accept-agreement">${RINGS()}${waitingForMe().length ? 'Agree to the whole agreement and the ticked rules' : 'Agree to the whole agreement'}</button><button type="button" class="btn link" data-act="back">Not now</button></div>
      </section>`;
  } else if (S.view === 'sign') {
    const keepLs = keepSigFields('ls'), keepConsent = $('#consent-box') && $('#consent-box').checked;
    const force = L.list.filter(r => r.status === 'force' || r.status === 'scheduled');
    v.innerHTML = `<div class="view-head"><h2 class="soft">Sign “${esc(S.ledger.name)}”</h2><button type="button" class="btn link" data-act="back">Back to the agreement</button></div>
      ${S.consent && !S.consent.given ? `<section class="card"><h3>Electronic signatures</h3><p>${esc(S.consent.notice)}</p>
        <label class="check"><input type="checkbox" id="consent-box"><span>I agree to use electronic records and signatures.</span></label></section>` : ''}
      <section class="card"><h3>What you’re signing</h3>
        <p>${force.length ? `The ${force.length} rule${force.length === 1 ? '' : 's'} in force today (or signed to take effect later), and every rule you sign from now on:` : 'There are no rules in force yet. Signing now covers every rule you sign from now on.'}</p>
        ${force.length ? reviewList(force) : ''}
        ${waitingList(waitingForMe(), 'sign')}
        ${signFields('ls', S.ledger.statement, 'ledger')}
        <div class="row"><button type="button" class="btn primary" data-act="sign-ledger">${RINGS()}${waitingForMe().length ? 'Sign the agreement and the ticked rules' : 'Sign the agreement'}</button><button type="button" class="btn link" data-act="back">Not now</button></div>
      </section>`;
    restoreSigFields('ls', keepLs); if (keepConsent && $('#consent-box')) $('#consent-box').checked = true;
  }
}
async function saveSettings() {
  const on = $('#set-binding') && $('#set-binding').checked, law = str($('#set-law') && $('#set-law').value);
  try {
    await api('POST', `/api/ledgers/${S.ledger.id}/settings`, { binding: !!on, governingLaw: law });
    await refresh(); await loadMe(); renderToolbar();
    toast(on ? 'The agreement is now legally binding. Sign it to start.' : 'Settings saved.');
    renderView();
  } catch (e) { toast(e.message || 'Couldn’t save the settings.'); }
}
async function saveVerify() {
  try {
    await api('POST', `/api/ledgers/${S.ledger.id}/settings`, { verifyEmail: !!($('#set-verify') && $('#set-verify').checked) });
    await refresh(); renderView();
    toast(S.ledger.verifyEmail ? 'Signatures here now need an emailed code.' : 'Signatures here no longer need an emailed code.');
  } catch (e) { toast(e.message || 'Couldn’t save.'); }
}
async function leaveLedger() {
  if (!T.leaveArm) { T.leaveArm = true; renderView(); return; }
  T.leaveArm = false;
  try {
    const name = S.ledger.name;
    await api('POST', `/api/ledgers/${S.ledger.id}/leave`, {});
    S.ledger = null; S.loaded = false;
    await loadMe();
    if (S.ledgers.length) await openLedger(S.ledgers[0].id); else showGate('no-ledgers');
    toast(`You’ve left “${name}”.`);
  } catch (e) { toast(e.message || 'Couldn’t leave the agreement.'); }
}
async function acceptAgreement() {
  try {
    const also = alsoTicked();
    const out = await api('POST', `/api/ledgers/${S.ledger.id}/accept`, { headHash: S.ledger.head, entries: also.map(r => r.id) });
    await refresh();
    leaveView();
    toast(`You’ve agreed to the whole agreement${out.agreed ? ` and ${out.agreed} rule${out.agreed === 1 ? '' : 's'}` : ''}.`);
  } catch (e) {
    toast(e.message || 'Couldn’t record that. Try again.');
    if (e.code === 'stale') { await refresh(); renderView(); }
  }
}
async function signLedger() {
  const sig = readSignature('ls');
  if (!sig) return;
  try {
    if (S.consent && !S.consent.given) {
      const c = $('#consent-box');
      if (!c || !c.checked) { if (c) c.focus(); toast('Agree to use electronic records and signatures first.'); return; }
      await api('POST', '/api/esign-consent', { version: S.consent.version });
    }
    const also = alsoTicked();
    const out = await api('POST', `/api/ledgers/${S.ledger.id}/sign`, Object.assign({ headHash: S.ledger.head, entries: also.map(r => ({ id: r.id, entryHash: r.hash })) }, sig));
    await refresh();
    leaveView();
    toast(out.signed ? `You’ve signed the agreement and ${out.signed} rule${out.signed === 1 ? '' : 's'}.` : 'You’ve signed the agreement. You can now sign rules in it.');
  } catch (e) {
    toast(e.message || 'Couldn’t sign just now. Try again.');
    if (e.code === 'stale') { await refresh(); renderView(); }
  }
}

function renderAccount() {
  const a = $('#account');
  if (!S.user) { a.hidden = true; return; }
  a.hidden = false;
  a.innerHTML = `${S.user.picture ? `<img src="${esc(S.user.picture)}" alt="" referrerpolicy="no-referrer">` : ''}<span>${esc(S.user.name)}</span><button type="button" class="btn link" data-act="sign-out">Sign out</button>`;
}

/* ---------- notifications ----------
   Asked for as soon as you're signed in. Firefox and Safari only show the prompt after a click, so if it's
   still unanswered, the first click anywhere asks again. Once allowed, each visit re-sends this device's subscription. */
const pushReady = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
async function subscribePush() {
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription()
    || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: (await api('GET', '/api/push')).key });
  await api('POST', '/api/push/subscribe', sub.toJSON());
}
function autoNotify() {
  if (!pushReady() || Notification.permission === 'denied') return;
  if (Notification.permission === 'granted') return void subscribePush().catch(() => {});
  const ask = () => Notification.requestPermission().then(p => p === 'granted' && subscribePush()).catch(() => {});
  const onClick = () => { if (Notification.permission === 'default') ask(); };
  document.addEventListener('click', onClick, { once: true, capture: true });
  ask().then(() => { if (Notification.permission !== 'default') document.removeEventListener('click', onClick, { capture: true }); });
}
function renderToolbar() {
  // Members take line colours in the order they joined, so the first n colours are an agreement's stripes.
  const side = $('#side');
  side.hidden = !S.ledgers.length;
  side.innerHTML = `<p>Your agreements</p>${S.ledgers.map(l => `<button type="button" class="side-item" data-act="open-ledger" data-id="${esc(l.id)}"${S.ledger && l.id === S.ledger.id ? ' aria-current="page"' : ''}>
    <span class="stripes" aria-hidden="true">${LINE_COLORS.slice(0, Math.max(1, Math.min(l.members || 1, 6))).map(c => `<i style="background:${c}"></i>`).join('')}</span>${esc(l.name)}</button>`).join('')}
    <button type="button" class="side-item new" data-act="new-ledger">+ New agreement</button>`;
  $('#ledgerName').textContent = S.ledger ? S.ledger.name : '';
  $('#membersCell').innerHTML = S.ledger ? `<span class="members" title="${esc(S.members.map(m => m.name + ' · ' + m.email).join('\n'))}">${S.members.map(m =>
    `<span class="who"><i style="--c:${lineColor(m.id)}"></i>${esc(firstName(m.id))}</span>`).join('')}</span>` : '';
}

async function createLedger() {
  const i = $('#ledger-name');
  const name = str(i && i.value);
  if (!name) { if (i) i.focus(); return; }
  try {
    const bind = !!($('#ledger-binding') && $('#ledger-binding').checked);
    const { id } = await api('POST', '/api/ledgers', { name, binding: bind, governingLaw: str($('#ledger-law') && $('#ledger-law').value) });
    await loadMe();
    showPanel(null);
    await openLedger(id, 'push');
    toast(bind ? `“${name}” is ready and legally binding. Sign it, then invite the others.` : `“${name}” is ready. Invite the others when you like.`);
  } catch (e) { toast(e.message || 'Couldn’t create the agreement.'); }
}
async function emailInvite() {
  const i = $('#invite-email'), b = $('[data-act="email-invite"]');
  if (!i || b.disabled) return;
  const email = i.value.trim();
  if (!email) return i.focus();
  b.disabled = true;
  try {
    const { to } = await api('POST', `/api/ledgers/${S.ledger.id}/invites/email`, { email });
    i.value = ''; toast(`Invite sent to ${to}.`);
  } catch (e) { toast(e.message || 'Couldn’t send the invite.'); }
  finally { b.disabled = false; i.focus(); }
}
async function invite() {
  if (!S.ledger) return;
  try {
    const { url, expiresAt } = await api('POST', `/api/ledgers/${S.ledger.id}/invites`, {});
    showPanel('invite', { url, days: Math.round((new Date(expiresAt) - Date.now()) / 864e5) });
  } catch (e) { toast(e.message || 'Couldn’t make an invite link.'); }
}
async function signOut() {
  try { await fetch('/auth/logout', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' }); } catch (e) {}
  location.href = '/';
}

async function loadMe() {
  const out = await api('GET', '/api/me');
  S.user = out.user; S.me = out.user.id; S.ledgers = out.ledgers;
  renderAccount();
  autoNotify();
}
let lastKey = '';
async function refresh() {
  if (!S.ledger) return;
  const st = await api('GET', `/api/ledgers/${S.ledger.id}`);
  const key = JSON.stringify(st);
  if (key === lastKey) return;
  lastKey = key;
  S.ledger = st.ledger; S.members = st.members; S.former = st.formerMembers || []; S.rules = st.entries; S.agr = st.agreements; S.loaded = true;
  S.consent = st.consent; S.ledgerSigs = st.ledgerSignatures || []; S.accepts = st.acceptances || []; S.sigs = st.signatures || []; S.myEmail = st.myEmail; S.mail = st.mail;
  renderToolbar();
  if (S.view === 'ledger') onData(); else { derive(); renderView(); }
  renderBindbar();
}
async function openLedger(id, how = 'replace') {
  if (!S.ledgers.some(l => l.id === id)) id = S.ledgers.length ? S.ledgers[0].id : null;
  if (!id) return showGate('no-ledgers');
  if (S.ledger && S.ledger.id === id && S.loaded) return;
  if (drafting()) closeComposer();
  S.ledger = { id, name: (S.ledgers.find(l => l.id === id) || {}).name || '' };
  S.rules = []; S.agr = []; S.members = []; S.former = []; S.loaded = false; S.scrolled = false; S.focus = null; S.showAll = false; lastKey = '';
  S.ledgerSigs = []; S.sigs = []; S.signing = null; S.view = 'ledger'; $('#view').hidden = true; $('#ledger').hidden = false;
  D = loadDraft() || blankDraft();
  try { localStorage.setItem('handshake.ledger', id); } catch (e) {}
  remember(how);
  showGate(null); renderToolbar(); renderLedger();
  await refresh();
}

// An invite link lands here as ?invite=<token>: show who invited you, and join only when asked.
async function showInvite(tok) {
  history.replaceState(null, '', '/');
  try { S.invite = Object.assign({ token: tok }, await api('GET', `/api/invites/${encodeURIComponent(tok)}`)); }
  catch (e) { S.invite = { token: tok, status: 'missing' }; }
  if (S.invite.status === 'member') return openLedger(S.invite.ledgerId);
  showGate('invite');
}
async function acceptInvite() {
  try {
    const { ledgerId } = await api('POST', `/api/invites/${encodeURIComponent(S.invite.token)}/accept`, {});
    S.invite = null;
    await loadMe();
    await openLedger(ledgerId, 'push');
    toast('You’ve joined. Rules written from now on need your agreement too.');
  } catch (e) { toast(e.message || 'Couldn’t join. Try again.'); }
}
async function leaveInvite() {
  S.invite = null;
  if (S.ledgers.length) { let want = null; try { want = localStorage.getItem('handshake.ledger'); } catch (e) {} await openLedger(want); }
  else showGate('no-ledgers');
}

async function boot() {
  renderLedger();
  if (pushReady()) navigator.serviceWorker.register('/sw.js').catch(() => {});
  try { await loadMe(); } catch (e) { if (e.code !== 'signed_out') { $('#gate').hidden = false; $('#gate').innerHTML = `<p class="notice">${esc(e.message || 'The agreement couldn’t load. Reload the page to try again.')}</p>`; } return; }
  S.ai = { json: async (prompt, opts = {}) => {
    const out = await api('POST', '/api/check', { prompt }, opts.signal);
    const v = parseLoose(out.text);
    if (v === undefined) throw { code: 'invalid_json' };
    return v;
  } };
  const inviteTok = new URLSearchParams(location.search).get('invite');
  if (inviteTok) { await showInvite(inviteTok); startPolling(); return; }
  let want = new URLSearchParams(location.search).get('l');
  try { want = want || localStorage.getItem('handshake.ledger'); } catch (e) {}
  if (!S.ledgers.length) { showGate('no-ledgers'); startPolling(); return; }
  // An address that names a view (a reload, or a link to settings) opens it.
  const v = new URLSearchParams(location.search).get('v');
  await openLedger(want);
  if (S.ledger && (v === 'settings' || v === 'sign')) setView(v, 'replace');
  startPolling();
}
// Pick up agreements and entries from the other members.
function startPolling() { setInterval(() => { if (!document.hidden && S.ledger) refresh().catch(() => {}); }, 2500); }
function parseLoose(t) {
  t = String(t || '').trim();
  try { return JSON.parse(t); } catch (e) {}
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) {} }
  return undefined;
}

boot();
})();
</script>
