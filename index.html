<script>try {
  /* One-time move from the keys used before the renames (Rule Ledger, then Pact). */
  for (const old of ['pact.', 'rule-ledger.']) for (const k of ['draft.v1', 'me', 'theme']) {
    const v = localStorage.getItem(old + k);
    if (v !== null && localStorage.getItem('handshake.' + k) === null) localStorage.setItem('handshake.' + k, v);
    localStorage.removeItem(old + k);
  }
  const t = localStorage.getItem('handshake.theme');
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
} catch (e) {}</script>

<style>
/* Layout: a subway map. Each member is a line in a map colour running down the agreement; each rule is a
   station on it. A rule everyone has agreed to is a transfer station (one white pill across every line), a
   member still to agree has a dashed line, and a replaced rule's station is grey. The agreement's header is a
   black station sign. Helvetica throughout, oldest first with the latest entry at the bottom. Drafting
   happens inline as the next row: write the rule, press Check, and a fast model finds the rules it touches
   (the list narrows to them, clashing words marked) and suggests edge cases.
   Status is always a word as well as a shape, never colour alone. */
:root {
  --ground: #e8e6e0;
  --page: #fff;
  --tint: #f4f3ef;
  --field: #fafaf8;
  --ink: #000;
  --ink-2: #3a3c3f;
  --muted: #53565a;
  --grid: #e3e3e0;
  --rule: #d6d3cb;
  --edge: #8d8f92;
  --accent: #000;
  --accent-tint: #ecebe6;
  --accent-soft: #f7f6f2;
  --on-accent: #fff;
  --link: #0080c7;
  --clash: #b8102f;
  --clash-bg: #fbdde3;
  --clash-soft: #fdf3f5;
  --clash-line: #f2c3cd;
  --edge-case: #9a4f00;
  --blank: #fff4c2;
  --sign: #000;
  --on-sign: #fff;
  --on-sign-2: #c8c9cb;
  --old: #979799;
  --scrim-shadow: rgba(0, 0, 0, .2);
  --f-display: "Helvetica Neue", Helvetica, Arimo, Arial, sans-serif;
  --f-text: var(--f-display);
  --f-ui: var(--f-display);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #141414; --page: #1e1e1e; --tint: #262626; --field: #232323; --ink: #f2f2f2; --ink-2: #d0d1d3; --muted: #a5a8ad;
    --grid: #2e2e2e; --rule: #3a3a3a; --edge: #6b6e72; --accent: #f2f2f2; --accent-tint: #2c2c2c; --accent-soft: #191919; --link: #4fb3ea;
    --on-accent: #000; --clash: #ff7d95; --clash-bg: #4a1f28; --clash-soft: #2a1a1e; --clash-line: #5c2a35; --edge-case: #ffb85c; --blank: #3d3517;
    --sign: #000; --on-sign: #fff; --on-sign-2: #a5a8ad; --old: #6b6e72;
    --scrim-shadow: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #141414; --page: #1e1e1e; --tint: #262626; --field: #232323; --ink: #f2f2f2; --ink-2: #d0d1d3; --muted: #a5a8ad;
  --grid: #2e2e2e; --rule: #3a3a3a; --edge: #6b6e72; --accent: #f2f2f2; --accent-tint: #2c2c2c; --accent-soft: #191919; --link: #4fb3ea;
  --on-accent: #000; --clash: #ff7d95; --clash-bg: #4a1f28; --clash-soft: #2a1a1e; --clash-line: #5c2a35; --edge-case: #ffb85c; --blank: #3d3517;
  --sign: #000; --on-sign: #fff; --on-sign-2: #a5a8ad; --old: #6b6e72;
  --scrim-shadow: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.5 var(--f-ui); padding: 32px 16px 48px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
button, .ref, .opt, a { transition: background-color .15s ease, color .15s ease, border-color .15s ease, text-decoration-color .15s ease; }
a { color: var(--ink); text-underline-offset: 3px; }
a:hover { color: var(--link); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
mark { background: var(--blank); color: var(--ink); padding: 0 .2em; border-radius: 4px; border-bottom: 1px dashed var(--edge); }
mark.clash { background: var(--clash-bg); border-bottom: 0; box-shadow: inset 0 -2px 0 var(--clash); }
.kw { background: var(--accent-tint); border-radius: 3px; padding: 0 .1em; }
code { font-size: .9em; }
.sc { font-family: var(--f-ui); font-weight: 700; }
.rings { width: 20px; height: 12px; flex: none; overflow: visible; }
.rings rect { fill: none; stroke: currentColor; stroke-width: 2; }
.rings.filled rect { fill: currentColor; }
.rings.dashed rect { stroke-dasharray: 3 2; }

/* Page frame: a soft rounded double rule */
.app { position: relative; max-width: 72rem; margin: 0 auto; }
.app-in { border-radius: 8px; overflow: hidden; background: var(--page); box-shadow: 0 0 0 1px var(--rule); }

/* Masthead: the H mark (two lines and a transfer station) and the name, on the page ground */
.mast { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 4px 4px 20px; }
.mast .mark { width: 32px; height: 32px; flex: none; }
.mast h1 { margin: 0; font: 700 24px/1 var(--f-display); letter-spacing: -.02em; }
.theme { margin-left: auto; display: inline-flex; padding: 2px; gap: 1px; border: 1px solid var(--rule); border-radius: 999px; background: var(--ground); }
.theme button { display: grid; place-items: center; width: 24px; height: 22px; border: 0; background: none; border-radius: 999px; padding: 0; color: var(--muted); cursor: pointer; }
.theme svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.theme svg .fill { fill: currentColor; stroke: none; }
.theme button:hover { color: var(--ink); }
.theme button[aria-pressed="true"] { background: var(--ink); color: var(--page); }

/* Account, sign-in gate, ledger switcher, members, panel */
.account { display: flex; align-items: center; gap: .55rem; margin-left: auto; font-size: .86rem; color: var(--muted); }
.account img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; flex: none; }
.account:not([hidden]) + .theme { margin-left: 0; }
.gate { padding: 3rem 1.5rem 3.5rem; text-align: center; display: grid; justify-items: center; gap: 1rem; }
.gate h2 { margin: 0; font: 700 2.2rem/1.1 var(--f-display); letter-spacing: -.02em; }
.gate p { margin: 0; max-width: 34rem; color: var(--ink-2); }
.gate .row { justify-content: center; }
.gate input[type="text"] { width: 18rem; }
/* Your agreements: a list beside the page, each with a stripe per member in their line colour */
.shell { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.shell > .app-in { flex: 999 1 640px; min-width: 0; }
.side { flex: 1 1 200px; max-width: 240px; display: flex; flex-direction: column; gap: 2px; padding-top: 2px; }
.side p { margin: 0 12px 8px; font-size: .86rem; color: var(--muted); }
.side-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border: 0; border-radius: 6px; background: none; color: var(--ink); font: 700 .95rem/1.3 var(--f-ui); text-align: left; cursor: pointer; overflow-wrap: anywhere; }
.side-item:hover { background: var(--accent-tint); }
.side-item[aria-current="page"] { background: var(--page); box-shadow: 0 0 0 1px var(--rule); }
.side-item.new { margin-top: 6px; color: var(--muted); }
.side-item.new:hover { color: var(--ink); }
.stripes { display: flex; gap: 3px; flex: none; }
.stripes i { display: block; width: 5px; height: 20px; }
/* Members as a map legend: each name beside a short stroke of their line colour */
.members { display: inline-flex; flex-wrap: wrap; align-items: center; gap: .4rem 1rem; font-size: .9rem; font-weight: 700; color: var(--on-sign); }
.members .who { display: inline-flex; align-items: center; gap: .45rem; }
.members .who i { display: block; width: 6px; height: 18px; background: var(--c); box-shadow: 0 0 0 1.5px var(--on-sign); }
.panel { padding: 1rem 1.5rem 1.2rem; border-bottom: 1px solid var(--grid); background: var(--accent-soft); display: grid; gap: .7rem; }
.panel-head { display: flex; justify-content: space-between; align-items: center; }
.panel h3 { margin: 0; font: 700 1.05rem var(--f-text); }
.panel input[type="text"], .panel input[type="email"] { max-width: 34rem; }
#draft-head { flex-wrap: wrap; }
.banner.swap { flex-basis: 100%; display: grid; gap: .6rem; background: var(--blank); border-color: var(--edge-case); }
.banner.swap p { margin: 0; font-weight: 700; }
/* Legally binding ledgers: status bar, settings and signing views, signature fields */
.bindbar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding: .7rem 1.5rem; border-bottom: 1px solid var(--rule); background: var(--accent-soft); font-size: .9rem; }
.bindbar.todo { background: var(--blank); }
.bindbar svg { width: 18px; height: 18px; fill: none; stroke: var(--accent); stroke-width: 1.4; flex: none; }
.bindbar.todo svg { stroke: var(--edge-case); }
.bindbar p { margin: 0; flex: 1; min-width: 14rem; }
.bindbar .dim, .dim { color: var(--muted); }
.view { padding: 1.5rem 1.5rem 2.5rem; display: grid; gap: 1.2rem; max-width: 52rem; }
.view-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: .5rem 1rem; }
.view-head h2 { margin: 0; font: 700 1.9rem/1.15 var(--f-display); letter-spacing: -.02em; }
.card { display: grid; gap: .8rem; padding: 1.1rem 1.25rem; border: 1px solid var(--rule); border-radius: 8px; background: var(--page); }
.card h3 { margin: 0; font: 700 1.05rem var(--f-text); }
.card p { margin: 0; }
.card .rings { color: var(--accent); vertical-align: -1px; margin-right: .3rem; }
.bad { color: var(--clash); }
.check { display: flex; gap: .65rem; align-items: flex-start; font-size: .92rem; cursor: pointer; }
.check input { width: 18px; height: 18px; margin: .1rem 0 0; accent-color: var(--accent); flex: none; }
.sig-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; font-size: .88rem; }
.sig-list li { display: flex; flex-wrap: wrap; gap: .55rem; align-items: center; }
.sig-list .who { font-weight: 600; min-width: 8rem; }
.sig-list .when { color: var(--muted); }
.sigbox { display: grid; gap: .7rem; padding: .9rem 1rem; border: 1px dashed var(--accent); border-radius: 12px; background: var(--accent-soft); }
.sig-statement { margin: 0; font: italic .98rem/1.5 var(--f-text); color: var(--ink-2); overflow-wrap: anywhere; }
.row-sign { display: grid; gap: .7rem; }
.sign-rules { margin: 0; padding-left: 1.2rem; display: grid; gap: .7rem; max-height: 22rem; overflow: auto; }
.sign-rules p { margin: .2rem 0 0; font: .98rem/1.55 var(--f-text); white-space: pre-wrap; }
.sign-rules li, .sign-waiting li { display: grid; gap: .3rem; }
.sign-waiting { list-style: none; margin: 0; padding: 0; display: grid; gap: .9rem; }
.also-text { display: block; margin-top: .2rem; font: .98rem/1.55 var(--f-text); white-space: pre-wrap; }
.sign-rules .e-actions, .sign-waiting .e-actions { font-size: .85rem; }
.agreements .signed-as { font-style: italic; color: var(--ink-2); }
.agreements .cert { gap: .8rem; padding-top: .3rem; border-top: 1px dashed var(--grid); }
.new-ledger { display: grid; gap: .7rem; justify-items: start; text-align: left; max-width: 34rem; }
.gate .new-ledger { margin: 0 auto; }
.new-ledger .law { width: 100%; display: none; }
.new-ledger:has(#ledger-binding:checked) .law { display: grid; }
.code-row input { width: 9rem; letter-spacing: .2em; font-variant-numeric: tabular-nums; }
/* Toolbar */
.toolbar { position: relative; display: grid; gap: 16px; padding: 30px 28px 22px; background: var(--sign); color: var(--on-sign); }
.sign-row { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center; justify-content: space-between; }
.sign-name { margin: 0; font: 700 2.6rem/1.05 var(--f-display); letter-spacing: -.02em; overflow-wrap: anywhere; }
.sign-actions { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
.toolbar::before { content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 3px; background: var(--on-sign); }
.toolbar .btn { background: transparent; color: var(--on-sign); border-color: var(--on-sign); }
.toolbar .btn:hover:not(:disabled) { background: #262626; }
.toolbar .btn.primary { background: var(--on-sign); color: #000; border-color: var(--on-sign); }
.toolbar .btn.primary:hover:not(:disabled) { background: #fdd200; filter: none; }
.toolbar .btn.primary .rings { color: #000; }
/* Filters and search, in a light bar under the sign */
.tools { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; padding: 12px 24px; border-bottom: 1px solid var(--grid); background: var(--accent-soft); }


/* Buttons */
.btn { display: inline-flex; align-items: center; gap: .55rem; text-decoration: none; border: 2px solid var(--ink); background: var(--page); color: var(--ink); border-radius: 6px; padding: .6rem 1.05rem; font: 700 .9rem/1.2 var(--f-ui); cursor: pointer; }
.btn:hover:not(:disabled) { background: var(--tint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.06); }
.btn.primary .rings { color: var(--on-accent); width: 18px; height: 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { padding: .38rem .8rem; font-size: .82rem; border-radius: 6px; }
.btn.link { border: 0; background: none; padding: .25rem 0; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; text-decoration-color: var(--edge); }
.btn.link:hover:not(:disabled) { background: none; text-decoration-color: var(--ink); }
.icon-btn { border: 1px solid var(--rule); background: var(--field); border-radius: 50%; width: 2.6rem; height: 2.6rem; font-size: 1.2rem; line-height: 1; cursor: pointer; color: var(--ink); flex: none; }
.icon-btn:hover { background: var(--tint); }
.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; background: var(--page); }
.seg button { border: 0; background: none; padding: .45rem .85rem; font: 700 .82rem var(--f-ui); white-space: nowrap; color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button:hover { background: var(--tint); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
#q { width: 15rem; max-width: 100%; padding: .5rem .8rem; border: 1px solid var(--edge); border-radius: 6px; background: var(--field); color: var(--ink); font: .88rem var(--f-ui); }
#q::placeholder { color: var(--muted); }

/* Register */
.ledger { --c1: max(4.5rem, calc(var(--lanes, 2) * 15px + 29px)); --c2: 8rem; --c4: 10.5rem; display: flex; flex-direction: column; background: var(--page); }
.ledger > #lhead { order: 0; } .ledger > #filterbar { order: 1; } .ledger > #rows { order: 3; }
.ledger > #draft, .ledger > #next { order: 4; } .ledger > #lfoot { order: 5; }
.ledger.newest > #draft, .ledger.newest > #next { order: 2; }
.lhead, .entry { position: relative; display: grid; grid-template-columns: var(--c1) var(--c2) minmax(0, 1fr) var(--c4); }
.lhead > *, .entry > * { padding: 1.2rem 1.35rem; border-left: 1px solid var(--grid); min-width: 0; }
.lhead > :first-child, .entry > :first-child { border-left: 0; }
.lhead > :nth-child(2), .entry > :nth-child(2) { border-left: 1px solid var(--grid); }
.lhead { background: var(--tint); border-bottom: 1px solid var(--rule); }
.lhead > * { padding-block: .6rem; font: 700 .82rem/1.2 var(--f-ui); display: flex; align-items: center; gap: .5rem; }
.lhead > :first-child { justify-content: center; }
.lhead .sort { border-top: 0; border-right: 0; border-bottom: 0; background: none; color: inherit; cursor: pointer; text-align: left; }
.lhead .sort:first-child { border-left: 0; }
.lhead .sort:hover { background: var(--grid); }
.lhead .arrow { font: 400 .78rem/1 var(--f-ui); color: var(--muted); }
#rows > .entry + .entry, #next > .entry { border-top: 1px solid var(--grid); }
.ledger.newest > #next > .entry, .ledger.newest > #draft { border-top: 0; border-bottom: 1px solid var(--grid); }
/* § numbers are small black signs; a rule's own number sits in the date column, beside its station */
.num { display: grid; place-items: start center; padding-inline: .5rem !important; }
.num b, .sec { display: inline-flex; align-items: center; justify-content: center; gap: 2px; min-width: 42px; height: 28px; padding: 0 8px; border-radius: 4px; background: var(--ink); color: var(--page); font: 700 15px/1 var(--f-ui); font-variant-numeric: tabular-nums; }
.num b::before, .sec::before { content: "§"; }
.entry.past .sec { background: var(--old); color: #fff; }
/* The lane: one line per member in their map colour; the rule is a station on it. Lines run edge to edge so
   they join up across rows, start at the station of the first row a member is on, and stop at the last. */
.lane { position: relative; padding: 0 !important; }
.lane i { position: absolute; display: block; }
.lane .ln { top: -1px; bottom: -1px; width: 12px; background: var(--c); }
.lane .ln.top { top: 34px; }
.lane .ln.bot { bottom: auto; height: 35px; }
.lane .ln.top.bot { display: none; }
.lane .ln.wait { background: repeating-linear-gradient(var(--c) 0 8px, transparent 8px 14px); }
.lane .stn { top: 22px; height: 24px; border-radius: 12px; background: #fff; border: 4px solid #000; }
.lane .stn.old { border-color: var(--old); }
.lane .stn.sched { border-style: dashed; }
.field.eff input { max-width: 14rem; }
.date { font: 400 .82rem/1.4 var(--f-ui); color: var(--muted); padding-top: 1.25rem !important; padding-inline: .9rem !important; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; gap: .5rem; align-items: flex-start; }
.pill-tag { font: 700 .75rem/1.6 var(--f-ui); border-radius: 4px; padding: 0 .5rem; }
.pill-tag.latest { background: var(--accent); color: var(--on-accent); }
.pill-tag.drafting { color: var(--accent); border: 1px solid var(--accent); }
.e-body { display: grid; gap: .65rem; align-content: start; }
.e-title { font: 700 1.3rem/1.3 var(--f-text); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.e-text { font: 400 1.07rem/1.65 var(--f-text); white-space: pre-wrap; max-width: 65ch; margin: 0; overflow-wrap: anywhere; }
.e-meta { font-size: .82rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: .2rem 1rem; }
.e-links, .e-actions { display: flex; flex-wrap: wrap; gap: .4rem 1.1rem; align-items: center; }
.e-status { padding-top: 1.5rem !important; display: flex; flex-direction: column; gap: .5rem; align-items: flex-start; }
.ref { font: 500 .82rem/1.3 var(--f-ui); border: 0; background: none; color: var(--ink); padding: 0; cursor: pointer; text-decoration: underline; text-decoration-color: var(--edge); text-underline-offset: 3px; text-align: left; }
.ref:hover { text-decoration-color: var(--ink); }
.entry.past .e-title { text-decoration: line-through; text-decoration-thickness: 1px; color: var(--muted); }
.entry.past .e-text { color: var(--muted); }
.entry.is-repeal .e-text { font-style: italic; }
.entry.latest { background: var(--accent-soft); }
.entry.rel-clash { background: var(--clash-soft); }
.entry.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--accent-tint); } }
.title-btn { all: unset; cursor: pointer; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.title-btn:hover { text-decoration-color: var(--edge); }
.title-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.entry.focused { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
/* Rules awaiting agreement: dashed medallion, hatched edge, and who still needs to agree */
.entry.pending { background: repeating-linear-gradient(-45deg, transparent 0 10px, var(--accent-soft) 10px 12px); }
.seal.s-pending { color: var(--edge-case); }
.pending-note { margin: 0; font-size: .86rem; color: var(--edge-case); }
.agreements { list-style: none; margin: 0; padding: .6rem .8rem; display: grid; gap: .35rem; border-radius: 6px; background: var(--field); border: 1px solid var(--grid); font-size: .84rem; }
.agreements li { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap; }
.agreements .who { font-weight: 600; min-width: 4.5rem; }

<script>
(() => {

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const str = v => typeof v === 'string' ? v.trim() : (v == null ? '' : String(v).trim());
const arr = v => Array.isArray(v) ? v : [];
const fol = n => String(n);
const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };
// An effective date: a calendar day, counted from the start of that day UTC.
const fmtDay = d => { const x = new Date(d + 'T00:00:00Z'); return isNaN(x) ? '' : x.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }); };
const fmtTime = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString(undefined, { dateStyle: 'full', timeStyle: 'short' }); };
const marked = t => esc(t).replace(/\[([^\]\n]{1,240})\]/g, '<mark>[$1]</mark>');
const listJoin = xs => xs.length < 2 ? (xs[0] || '') : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1];
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

const TYPE = { ambiguity: 'Vague wording', edge_case: 'Edge case', gap: 'Missing piece' };
const KIND = { contradicts: 'Contradicts', overlaps: 'Overlaps', refines: 'Refines' };
const RES = { supersede: 'Replaced by this entry', exception: 'Kept; this entry is an exception to it', relate: 'Kept, linked as related', keep: 'Kept; judged compatible' };
const REL = { contradicts: 'Conflicts', overlaps: 'Overlaps', refines: 'Refines', related: 'Related', replaces: 'Will be replaced', repeals: 'To be repealed' };
const DECIDE = { supersede: 'Will be superseded', keep: 'Stays in force' };
const RINGS = (cls = '') => `<svg class="rings ${cls}" viewBox="0 0 20 12" aria-hidden="true"><rect x="1" y="1" width="18" height="10" rx="5"/></svg>`;

/* Rule text with [blanks] marked and an exact phrase (a conflict) marked. */
function richText(t, info) {
  t = str(t);
  const q = info && str(info.quote);
  const i = q ? t.toLowerCase().indexOf(q.toLowerCase()) : -1;
  if (i < 0) return marked(t);
  return marked(t.slice(0, i)) + `<mark class="clash">${esc(t.slice(i, i + q.length))}</mark>` + marked(t.slice(i + q.length));
}

/* ---------- state ---------- */
const S = { user: null, me: null, ledgers: [], ledger: null, members: [], former: [], accepts: [], signIn: true, view: 'ledger', consent: null, ledgerSigs: [], sigs: [], signing: null,
  status: 'connecting', loaded: false, rules: [], agr: [], filter: 'all', q: '', newest: false,
  open: new Set(), profiles: {}, pendingJump: null, showAll: false, scrolled: false, focus: null, ai: null };
let L = { list: [], byId: new Map(), lanes: [] };
const T = { busy: false, busyAt: 'top', ctl: null, progress: '', error: '', saving: false, discardArm: false, scrollTo: null, swap: null };

function blankDraft() {
  return { mode: 'rule', text: '', firstText: '', title: '', titleTouched: false, checked: false, checkedText: '',
    related: [], resolve: {}, edges: [], include: {}, supersedes: [], amending: null, reason: '', effectiveOn: '', entryId: null, touched: false };
}
function loadDraft() {
  try { const v = JSON.parse(localStorage.getItem(draftKey()) || 'null'); if (v && typeof v === 'object') return Object.assign(blankDraft(), v); } catch (e) {}
  return null;
}
// One draft per ledger, kept in this browser.
const draftKey = () => DKEY + '.' + (S.ledger ? S.ledger.id : '');
function saveDraft() { if (S.ledger) try { localStorage.setItem(draftKey(), JSON.stringify(D)); } catch (e) {} }
